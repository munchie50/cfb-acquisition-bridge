name: CFB QA Refresh v1.246 Output Plumbing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb_qa_refresh_v1_246_output_plumbing.yml'
permissions:
  contents: read
jobs:
  output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pandas numpy
      - name: Acquire frozen fit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/munchie50/cfb-acquisition-bridge/actions/artifacts/10895838069/zip > fit.zip
          echo "3a2cabfcd37e0bcf0cae85efc77eaa6755ffb12734d1e48c4c582ed1de375587  fit.zip" | sha256sum -c -
          mkdir fit
          unzip -q fit.zip -d fit
          find fit -name selected_coefficients.csv -print -quit | xargs dirname > fitpath.txt
      - name: Execute exact persisted output block
        run: |
          python scripts/cfb_qa_refresh_v1_246_output_plumbing_2026_09_28.py "$(cat fitpath.txt)" out
