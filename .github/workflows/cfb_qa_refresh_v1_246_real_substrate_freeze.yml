name: CFB QA v1.246 Real Substrate Freeze
on:
  push:
    branches: [main]
    paths:\n      - '.github/workflows/cfb_qa_refresh_v1_246_real_substrate_freeze.yml'
permissions:\n  contents: read\n  actions: read
jobs:
  substrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas numpy pyarrow pyreadr
      - name: Download immutable raw boundary and frozen fit
        env:\n          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/munchie50/cfb-acquisition-bridge/actions/artifacts/11031055060/zip > raw.zip
          echo "1495f453e5d9f262baddfa2b7ad21d2d9e8d5f8c2436f058f88fcb6ebc6d8d68  raw.zip" | sha256sum -c -
          mkdir rawpkg
          unzip -q raw.zip -d rawpkg
          echo "9847952ba52279318018a259c07197df23392086f03bd6a308fd2cf60e83cd2c  rawpkg/cfb_schedules_2026.parquet" | sha256sum -c -
          echo "eab0562fb2f9dd9c65cf1457c469d656d9247212694370cac10c789e673a2ddb  rawpkg/pbp_2026.rds" | sha256sum -c -
          gh api repos/munchie50/cfb-acquisition-bridge/actions/artifacts/10895838069/zip > fit.zip
          echo "3a2cabfcd37e0bcf0cae85efc77eaa6755ffb12734d1e48c4c582ed1de375587  fit.zip" | sha256sum -c -
          mkdir fit
          unzip -q fit.zip -d fit
          find fit -name selected_coefficients.csv -print -quit | xargs dirname > fitpath.txt
      - name: Run accepted v1.246 producer at frozen cutoff
        run: |
          mkdir out
          python scripts/phase4_challenger_b_2026_refresh_predict_v1_246.py rawpkg/challenger_b_2026_future_target_projection_v1_217.csv rawpkg/cfb_schedules_2026.parquet rawpkg/pbp_2026.rds "$(cat fitpath.txt)" out "2026-09-29T11:39:08.824054+00:00"
      - name: Freeze real target-side substrate
        run: |
          mkdir package
          cp out/challenger_b_2026_refresh_team_side_substrate_v1_246.csv package/
          cp out/manifest_v1_246.json package/
          python - <<'PY'
          import pandas as pd,hashlib,json
          from pathlib import Path
          p=Path("package/challenger_b_2026_refresh_team_side_substrate_v1_246.csv")
          x=pd.read_csv(p,dtype={"game_id":str})
          assert not x.duplicated(["game_id","team"]).any()
          assert {"qualified_prior_games","snapshot_type","snapshot_cutoff_utc"}.issubset(x.columns)
          assert set(x.snapshot_type)=={"REFRESH_SNAPSHOT"}
          assert set(x.snapshot_cutoff_utc)=={"2026-09-29T11:39:08.824054+00:00"}
          m={"status":"QA_REAL_TARGET_SIDE_SUBSTRATE_FROZEN_NOT_S2_EXECUTED","rows":len(x),"substrate_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"raw_artifact_id":11031055060,"raw_zip_sha256":"1495f453e5d9f262baddfa2b7ad21d2d9e8d5f8c2436f058f88fcb6ebc6d8d68","s2_predictions_produced":False,"target_outcomes_joined":False,"market_joined":False}
          Path("package/QA_REAL_SUBSTRATE_MANIFEST.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print("V1_246_REAL_SUBSTRATE_FREEZE_READY",len(x),m["substrate_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-qa-v1-246-real-target-side-substrate
          path: package/
          retention-days: 90
