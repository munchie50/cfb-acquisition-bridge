name: CFB Monitor live-source handoff QA
on:
  push:
    branches: [qa/monitor-actions-rehearsal-20261110]
    paths: [qa/monitor-live-source-readback-20261110.json]
permissions:
  contents: write
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
      FIXTURE_HEAD: 37d692d65b05632a376d31cdefbd3ec23ef5103e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate connector request
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path('qa/monitor-live-source-readback-20261110.json').read_text())
          if request != {'request_id': 'monitor-live-source-readback-20261110', 'fixture_head': os.environ['FIXTURE_HEAD']}:
              raise ValueError('Unexpected test request')
          PY
      - name: Verify pinned checkout and immutable reviews
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FIXTURE_HEAD" "$GITHUB_SHA"
          test "$(git hash-object scripts/cfb_runtime_checkout.py)" = "$(git rev-parse "$FIXTURE_HEAD:scripts/cfb_runtime_checkout.py")"
          python3 scripts/cfb_runtime_checkout.py --destination "$RUNNER_TEMP/verified-repo" --expected-head "$FIXTURE_HEAD" > "$RUNNER_TEMP/runtime.json"
          python3 -c 'import json, sys; x = json.load(open(sys.argv[1])); print(x["status"], x["head"], len(x["immutable_reviews"]))' "$RUNNER_TEMP/runtime.json"
      - name: Replay independently reviewed Week 11 packet
        working-directory: ${{ runner.temp }}/verified-repo
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import cfb_week11_publication as week
          import cfb_neutral_publication_gate as gate

          def bound(path, expected):
              value = Path(path).read_text()
              if gate.blob(value) != expected:
                  raise ValueError(f'packet identity mismatch: {path}')
              return value

          e = 'evidence/'
          op = e + 'operational/'
          capture = bound(op + 'CFB_WEEK11_CBS_FBS_TABLES_20261110T140351Z.md', 'eb7b960239ef4f791faf32962b1f97abafea537d')
          reviewed = bound(e + 'audits/CFB_WEEK11_WORKING_DECISION_ROWS_20261110T140911Z.json', '4b25f9f0cd720f964aabf06a2c953cda52414586')
          lineage = bound(e + 'audits/CFB_WEEK11_ORIGINAL_ANCESTRY_RECOVERY_20261109.json', week.WEEK11_LINEAGE_SHA)
          rows = json.loads(reviewed, object_pairs_hook=gate.unique)
          counts = collections.Counter(row['state'] for row in rows)
          if counts != {'PASS': 30, 'INCONCLUSIVE': 37}:
              raise ValueError('unexpected reviewed decision state counts')
          as_of = '2026-11-10T14:09:11Z'
          source_at = '2026-11-10T14:03:51Z'
          marker = '```' + week.SOURCE_TAG + '\n'
          market = Path(op + 'CFB_MARKET_MONITOR_STATE.md').read_text().split(marker, 1)[0]
          decision = Path(op + 'CFB_DECISION_WAIT_LEDGER.md').read_text().split(marker, 1)[0]
          market, decision = week.compile(market, decision, capture, lineage,
                                           'CFB_MARKET_MONITOR_20261110T140911Z', as_of, source_at, rows)
          args = (market, decision, Path(op + 'CFB_EXECUTION_LEDGER.md').read_text(),
                  Path(op + 'CFB_POSTGAME_FIRST_FROZEN_SCORECARD.md').read_text(), lineage, as_of, 'WEEK11')
          sheet = gate.render(*args)
          output = Path(os.environ['RUNNER_TEMP']) / 'reviewed-handoff'
          output.mkdir()
          for name, data in [('market.md', market), ('decision.md', decision), ('sheet.md', sheet)]:
              target = output / name
              target.write_text(data)
              if target.read_text() != data:
                  raise ValueError(f'readback mismatch: {name}')
          audit = gate.audit((output / 'sheet.md').read_text(), *args)
          if audit['games'] != 67:
              raise ValueError('unexpected reviewed game population')
          proof = {'scope': 'historical reviewed packet', 'as_of': as_of, 'source_at': source_at,
                   'games': audit['games'], 'states': dict(counts), 'sheet_blob': gate.blob(sheet)}
          (output / 'result.json').write_text(json.dumps(proof, indent=2))
          print(json.dumps(proof))
          PY
      - name: Normalize fresh CBS board and compare reviewed prices
        working-directory: ${{ runner.temp }}/verified-repo
        env:
          PYTHONPATH: scripts:${{ github.workspace }}/qa
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          from cfb_actions_cbs_extract import extract
          from cfb_week11_publication import board, WEEK11_URL
          from cfb_neutral_publication_gate import blob

          output = Path(os.environ['RUNNER_TEMP']) / 'cbs-probe'
          output.mkdir(exist_ok=True)
          url = WEEK11_URL
          result = {'source': url, 'started_at': datetime.now(timezone.utc).isoformat()}
          passed = False
          try:
              with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=25) as response:
                  body = response.read(8_000_001)
                  result.update(http=response.status, final_url=response.geturl(), bytes=len(body),
                                sha256=hashlib.sha256(body).hexdigest())
              recovered_at = datetime.now(timezone.utc).isoformat()
              if result['http'] != 200 or result['final_url'] != url or len(body) > 8_000_000:
                  raise ValueError('unqualified CBS response')
              capture = extract(body.decode('utf-8'))
              lineage = Path('evidence/audits/CFB_WEEK11_ORIGINAL_ANCESTRY_RECOVERY_20261109.json').read_text()
              fresh = board(capture, lineage, recovered_at)
              prior = Path('evidence/operational/CFB_WEEK11_CBS_FBS_TABLES_20261110T140351Z.md').read_text()
              if blob(prior) != 'eb7b960239ef4f791faf32962b1f97abafea537d':
                  raise ValueError('review source identity mismatch')
              reviewed = board(prior, lineage, '2026-11-10T14:03:51Z')
              original = {game['game_id']: game for game in reviewed['games']}
              changed = [game['game_id'] for game in fresh['games']
                         if game['team_offers'] != original[game['game_id']]['team_offers']]
              (output / 'capture.md').write_text(capture)
              (output / 'normalized.json').write_text(json.dumps(fresh, indent=2))
              result.update(coverage=fresh['coverage'], capture_blob=blob(capture),
                            recovered_by=recovered_at, qualification=fresh['qualification'],
                            changed_market_game_ids=changed, changed_market_games=len(changed))
              passed = fresh['coverage']['matched_games'] == 67
          except Exception as exc:
              result.update(error_type=type(exc).__name__, error=str(exc)[:400])
          result.update(retrieved_at=datetime.now(timezone.utc).isoformat(), board_access=passed,
                        scope='normalized live display, separate from historical reviewed replay')
          (output / 'result.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: week11-source-and-reviewed-handoff
          path: |
            ${{ runner.temp }}/reviewed-handoff/
            ${{ runner.temp }}/cbs-probe/
          if-no-files-found: error
      - name: Publish bound live-source QA result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qa/monitor-actions-rehearsal-20261110'
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          fresh = json.loads((root / 'cbs-probe/result.json').read_text())
          replay = json.loads((root / 'reviewed-handoff/result.json').read_text())
          if fresh['board_access'] is not True or fresh['coverage']['matched_games'] != 67 or replay['games'] != 67:
              raise ValueError('Required QA coverage missing')
          result = {
              'status': 'PASS_LIVE_SOURCE_HANDOFF',
              'request_id': 'monitor-live-source-readback-20261110',
              'request_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'pinned_head': os.environ['FIXTURE_HEAD'],
              'fresh_source': fresh,
              'historical_render': replay,
          }
          (root / 'live-source-result.json').write_text(json.dumps(result, indent=2))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/qa/monitor-live-source-readback-20261110-result.json" \
            -f branch="$GITHUB_REF_NAME" \
            -f message='Record isolated Market Monitor live-source QA result' \
            -f content="$(base64 -w0 "$RUNNER_TEMP/live-source-result.json")" --jq '.commit.sha'
