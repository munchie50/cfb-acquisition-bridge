name: CFB Phase4 Challenger B Mechanical Features v1.167
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase4_challenger_b_mechanical_features_v1_167.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas pyreadr
      - name: Acquire accepted v1.166 and PBP
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir hist raw
          gh api repos/${{ github.repository }}/actions/artifacts/10895405612/zip > /tmp/h.zip
          unzip -q /tmp/h.zip -d hist
          for YEAR in {2016..2024}; do curl --fail --location --retry 3 --output "raw/pbp_${YEAR}.rds" "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"; done
      - run: python scripts/phase4_challenger_b_mechanical_features_v1_167.py hist raw out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cfb-phase4-challenger-b-mechanical-features-v1-167, path: out/}
