name: CFB Semantic Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base
          Rscript --version

      - name: Acquire primary PBP proof seasons
        run: |
          mkdir -p raw evidence

          for YEAR in 2017 2018 2022; do
            curl --fail --location --retry 3 \
              --output "raw/pbp_${YEAR}.rds" \
              "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"
          done

      - name: Inspect canary semantics and freeze lineage evidence
        shell: Rscript {0}
        run: |
          dir.create(
            "evidence",
            showWarnings = FALSE
          )

          required <- c(
            "game_id",
            "id_play",
            "pos_team",
            "def_pos_team",
            "play_type",
            "play_text",
            "down",
            "distance",
            "yards_gained",
            "period"
          )

          semantic_candidates <- c(
            "rush",
            "pass",
            "turnover",
            "turnover_indicator",
            "fumble_lost",
            "interception",
            "scoring_play",
            "offense_play",
            "defense_play",
            "drive_id",
            "home",
            "away",
            "home_score",
            "away_score",
            "pos_team_score",
            "def_pos_team_score",
            "start_time",
            "game_date",
            "week",
            "season_type",
            "completed"
          )

          schema <- list()
          samples <- list()

          for (year in c(
            2017,
            2018,
            2022
          )) {

            x <- readRDS(
              sprintf(
                "raw/pbp_%d.rds",
                year
              )
            )

            missing_required <- setdiff(
              required,
              names(x)
            )

            if (
              length(
                missing_required
              ) > 0
            ) {
              stop(
                paste(
                  year,
                  "missing required columns:",
                  paste(
                    missing_required,
                    collapse = ","
                  )
                )
              )
            }

            available_semantics <- intersect(
              semantic_candidates,
              names(x)
            )

            schema[[
              as.character(year)
            ]] <- data.frame(
              season = year,
              rows = nrow(x),
              columns = ncol(x),
              unique_games =
                length(
                  unique(
                    as.character(
                      x$game_id
                    )
                  )
                ),
              required_columns_present =
                TRUE,
              semantic_columns =
                paste(
                  available_semantics,
                  collapse = "|"
                ),
              stringsAsFactors = FALSE
            )

            gids <- sort(
              unique(
                as.character(
                  x$game_id
                )
              )
            )

            gids <- gids[
              !is.na(gids)
            ]

            pick <- unique(
              gids[
                c(
                  1,
                  ceiling(
                    length(gids) / 2
                  ),
                  length(gids)
                )
              ]
            )

            for (gid in pick) {

              g <- x[
                as.character(
                  x$game_id
                ) == gid,
                ,
                drop = FALSE
              ]

              keep <- intersect(
                c(
                  required,
                  semantic_candidates
                ),
                names(g)
              )

              z <- g[
                ,
                keep,
                drop = FALSE
              ]

              z$canary_season <-
                year

              z$canary_game_id <-
                gid

              samples[[
                paste(
                  year,
                  gid
                )
              ]] <- z
            }
          }

          write.csv(
            do.call(
              rbind,
              schema
            ),
            "evidence/schema_contract_check.csv",
            row.names = FALSE
          )

          all_names <- unique(
            unlist(
              lapply(
                samples,
                names
              )
            )
          )

          aligned <- lapply(
            samples,
            function(z) {

              for (
                m in setdiff(
                  all_names,
                  names(z)
                )
              ) {
                z[[m]] <- NA
              }

              z[
                ,
                all_names,
                drop = FALSE
              ]
            }
          )

          write.csv(
            do.call(
              rbind,
              aligned
            ),
            "evidence/conceptual_input_samples.csv",
            row.names = FALSE
          )

          contract <- list(
            derivation_version =
              "semantic_canary_v0.1",

            proof_families = c(
              "PRIOR_SCORING",
              "PRIOR_PLAY_VOLUME",
              "RAW_TURNOVER_RATE"
            ),

            temporal_invariant =
              paste(
                "every source_available_at",
                "< target_prediction_cutoff"
              ),

            separate_tests = c(
              "REPRODUCTION",
              "LEAKAGE",
              "APPLICABILITY",
              "MISSINGNESS"
            ),

            no_history_policy =
              paste(
                "explicit applicable-no-prior-history;",
                "never coerce to zero"
              ),

            no_fitting = TRUE,
            no_tuning = TRUE,

            no_test_outcome_optimization =
              TRUE,

            note = paste(
              "This run freezes executable",
              "input/schema evidence before",
              "formulas are promoted.",
              "It intentionally does not",
              "infer scoring or turnover",
              "semantics from column names alone."
            )
          )

          dput(
            contract,
            file =
              "evidence/canary_contract.dput"
          )

      - name: Freeze evidence hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          records = []

          for p in sorted(
              Path("evidence").rglob("*")
          ):
              if (
                  p.is_file()
                  and
                  p.name !=
                  "evidence_manifest.json"
              ):
                  b = p.read_bytes()

                  records.append({
                      "filename":
                          str(
                              p.relative_to(
                                  "evidence"
                              )
                          ),
                      "bytes":
                          len(b),
                      "sha256":
                          hashlib.sha256(
                              b
                          ).hexdigest(),
                  })

          manifest = {
              "scope":
                  "CFB semantic canary input/schema proof",

              "derivation_version":
                  "semantic_canary_v0.1",

              "fitting_performed":
                  False,

              "tuning_performed":
                  False,

              "test_outcome_optimization":
                  False,

              "records":
                  records,
          }

          out = Path(
              "evidence/evidence_manifest.json"
          )

          out.write_text(
              json.dumps(
                  manifest,
                  indent = 2,
                  sort_keys = True
              ) + "\n",
              encoding = "utf-8"
          )

          print(
              "EVIDENCE_MANIFEST_SHA256",
              hashlib.sha256(
                  out.read_bytes()
              ).hexdigest()
          )
          PY

      - name: Upload semantic canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-semantic-canary-input-proof
          path: evidence/
          if-no-files-found: error
          retention-days: 1
