name: CFB Cross-Source Adjudication

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base
          Rscript --version

      - name: Acquire independent ESPN PBP
        run: |
          mkdir -p raw evidence

          for YEAR in 2017 2018 2019 2020 2022 2025; do
            curl --fail --location --retry 3 \
              --output "raw/espn_${YEAR}.rds" \
              "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_cfb_pbp/play_by_play_${YEAR}.rds"
          done

      - name: Cross-source adjudication
        shell: Rscript {0}
        run: |
          dir.create("evidence", showWarnings = FALSE)

          regular_missing <- c(
            "400935239",
            "400941794",
            "400944860",
            "400944873",
            "401015050",
            "401019521",
            "401121942",
            "401260158",
            "401265699",
            "401267165",
            "401267166",
            "401269375",
            "401269376",
            "401269378",
            "401269381",
            "401269382",
            "401269384"
          )

          primitive_exception_games <- c(
            "401403882",
            "401403885",
            "401403886",
            "401403888",
            "401403994",
            "401756900"
          )

          years <- c(
            2017, 2018, 2019,
            2020, 2022, 2025
          )

          coverage <- list()
          exception_rows <- list()
          schema_rows <- list()

          for (year in years) {

            x <- readRDS(
              sprintf("raw/espn_%d.rds", year)
            )

            game_col <- intersect(
              c(
                "game_id",
                "gameId",
                "id_game",
                "id"
              ),
              names(x)
            )

            if (length(game_col) == 0) {
              stop(
                paste(
                  year,
                  "has no recognized game ID column"
                )
              )
            }

            game_col <- game_col[[1]]

            x$game_id_chr <-
              as.character(x[[game_col]])

            schema_rows[[as.character(year)]] <-
              data.frame(
                season = year,
                rows = nrow(x),
                columns = ncol(x),
                game_id_column = game_col,
                unique_games =
                  length(unique(
                    x$game_id_chr[
                      !is.na(x$game_id_chr)
                    ]
                  )),
                stringsAsFactors = FALSE
              )

            target_missing <- intersect(
              regular_missing,
              unique(x$game_id_chr)
            )

            for (gid in regular_missing) {

              if (!(gid %in% unique(x$game_id_chr))) {
                next
              }

              g <- x[
                x$game_id_chr == gid,
                ,
                drop = FALSE
              ]

              coverage[[paste(year, gid)]] <-
                data.frame(
                  season = year,
                  game_id = gid,
                  rows = nrow(g),
                  columns = ncol(g),
                  source = "espn_cfb_pbp",
                  classification =
                    "ALTERNATE_SOURCE_PRESENT",
                  stringsAsFactors = FALSE
                )
            }

            for (gid in primitive_exception_games) {

              if (!(gid %in% unique(x$game_id_chr))) {
                next
              }

              g <- x[
                x$game_id_chr == gid,
                ,
                drop = FALSE
              ]

              wanted <- intersect(
                c(
                  "game_id_chr",
                  "game_id",
                  "id_play",
                  "play_id",
                  "period",
                  "clock",
                  "clock_minutes",
                  "clock_seconds",
                  "down",
                  "distance",
                  "yards_to_goal",
                  "yards_gained",
                  "play_type",
                  "play_text",
                  "text",
                  "pos_team",
                  "def_pos_team",
                  "drive_id",
                  "rush",
                  "pass",
                  "scoring_play",
                  "turnover_indicator"
                ),
                names(g)
              )

              z <- g[, wanted, drop=FALSE]
              z$adjudication_season <- year
              z$adjudication_game_id <- gid

              exception_rows[[paste(year, gid)]] <- z
            }

            cat(
              "ESPN_SOURCE",
              year,
              "ROWS", nrow(x),
              "GAMES",
              length(unique(
                x$game_id_chr[
                  !is.na(x$game_id_chr)
                ]
              )),
              "MISSING_TARGETS_FOUND",
              length(target_missing),
              "\n"
            )
          }

          schema <- do.call(
            rbind,
            schema_rows
          )

          write.csv(
            schema,
            "evidence/espn_schema_summary.csv",
            row.names = FALSE
          )

          if (length(coverage) > 0) {
            cov <- do.call(rbind, coverage)
          } else {
            cov <- data.frame(
              season = integer(),
              game_id = character(),
              rows = integer(),
              columns = integer(),
              source = character(),
              classification = character()
            )
          }

          write.csv(
            cov,
            "evidence/alternate_source_coverage.csv",
            row.names = FALSE
          )

          found <- unique(cov$game_id)

          unresolved <- setdiff(
            regular_missing,
            found
          )

          resolution <- data.frame(
            game_id = regular_missing,
            alternate_source_present =
              regular_missing %in% found,
            classification =
              ifelse(
                regular_missing %in% found,
                "ALTERNATE_SOURCE_PRESENT",
                "UNRESOLVED_AFTER_ESPN_RELEASE"
              ),
            stringsAsFactors = FALSE
          )

          write.csv(
            resolution,
            "evidence/missing_game_resolution.csv",
            row.names = FALSE
          )

          if (length(exception_rows) > 0) {

            all_names <- unique(unlist(
              lapply(exception_rows, names)
            ))

            aligned <- lapply(
              exception_rows,
              function(z) {
                miss <- setdiff(
                  all_names,
                  names(z)
                )

                for (m in miss) {
                  z[[m]] <- NA
                }

                z[, all_names, drop=FALSE]
              }
            )

            exceptions <- do.call(
              rbind,
              aligned
            )

            write.csv(
              exceptions,
              "evidence/espn_exception_games.csv",
              row.names = FALSE
            )
          }

          cat(
            "RESOLUTION",
            "TARGETS", length(regular_missing),
            "FOUND", length(found),
            "UNRESOLVED", length(unresolved),
            "\n"
          )

          if (length(unresolved) > 0) {
            cat(
              "UNRESOLVED_IDS",
              paste(unresolved, collapse=","),
              "\n"
            )
          }

      - name: Freeze evidence hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          records = []

          for p in sorted(Path("evidence").rglob("*")):
              if (
                  p.is_file()
                  and p.name != "evidence_manifest.json"
              ):
                  data = p.read_bytes()
                  records.append({
                      "filename":
                          str(p.relative_to("evidence")),
                      "bytes": len(data),
                      "sha256":
                          hashlib.sha256(data).hexdigest(),
                  })

          manifest = {
              "scope":
                  "CFB cross-source adjudication",
              "primary_source":
                  "cfbfastR_cfb_pbp",
              "alternate_source":
                  "espn_cfb_pbp",
              "fitting_performed": False,
              "tuning_performed": False,
              "test_outcome_optimization": False,
              "records": records,
          }

          out = Path(
              "evidence/evidence_manifest.json"
          )

          out.write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "EVIDENCE_MANIFEST_SHA256",
              hashlib.sha256(
                  out.read_bytes()
              ).hexdigest()
          )
          PY

      - name: Upload adjudication evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-cross-source-adjudication
          path: evidence/
          if-no-files-found: error
          retention-days: 1
