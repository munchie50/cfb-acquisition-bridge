name: CFB PBP Acquisition 2016-2025

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Acquire original PBP bytes
        run: |
          mkdir -p out

          for YEAR in {2016..2025}; do
            echo "Downloading ${YEAR}"

            curl --fail --location --retry 3 \
              --output "out/play_by_play_${YEAR}.rds" \
              "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"
          done

      - name: Freeze byte manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = []

          for year in range(2016, 2026):
              p = Path(f"out/play_by_play_{year}.rds")
              data = p.read_bytes()

              if not data:
                  raise RuntimeError(f"{year}: empty PBP file")

              item = {
                  "season": year,
                  "filename": p.name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
              files.append(item)

              print(
                  year,
                  item["bytes"],
                  item["sha256"],
              )

          manifest = {
              "source": "sportsdataverse/sportsdataverse-data",
              "release": "cfbfastR_cfb_pbp",
              "seasons": "2016-2025",
              "files": files,
          }

          p = Path("out/pbp_byte_manifest_2016_2025.json")
          p.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              "BYTE_MANIFEST_SHA256",
              hashlib.sha256(p.read_bytes()).hexdigest()
          )
          PY

      - name: Build structural manifests from RDS
        shell: Rscript {0}
        run: |
          dir.create("evidence", showWarnings = FALSE)

          years <- 2016:2025

          primitive_candidates <- c(
            "game_id",
            "id",
            "play_id",
            "drive_id",
            "period",
            "quarter",
            "clock",
            "down",
            "distance",
            "yards_to_go",
            "yards_gained",
            "yards_to_goal",
            "yard_line",
            "play_type",
            "play_text",
            "offense",
            "offense_play",
            "defense",
            "home",
            "away",
            "home_score",
            "away_score",
            "score",
            "scoring",
            "rush",
            "pass"
          )

          for (year in years) {
            f <- sprintf(
              "out/play_by_play_%d.rds",
              year
            )

            x <- readRDS(f)

            if (!is.data.frame(x)) {
              stop(
                sprintf(
                  "%d: RDS is not a data.frame",
                  year
                )
              )
            }

            cols <- names(x)
            lower <- tolower(cols)

            game_candidates <- cols[
              lower %in% c(
                "game_id",
                "gameid",
                "game_id_espn",
                "espn_game_id"
              )
            ]

            unique_games <- NA_integer_
            game_id_column <- NA_character_

            if (length(game_candidates) > 0) {
              game_id_column <- game_candidates[[1]]
              unique_games <- length(
                unique(x[[game_id_column]][
                  !is.na(x[[game_id_column]])
                ])
              )
            }

            matched <- cols[
              lower %in% primitive_candidates
            ]

            evidence <- list(
              season = year,
              rows = nrow(x),
              columns = ncol(x),
              game_id_column = game_id_column,
              unique_game_ids = unique_games,
              column_names = cols,
              primitive_candidate_columns = matched
            )

            saveRDS(
              evidence,
              sprintf(
                "evidence/schema_%d.rds",
                year
              )
            )

            dput(
              evidence,
              file = sprintf(
                "evidence/schema_%d.txt",
                year
              )
            )

            cat(
              "STRUCTURE",
              year,
              "rows", nrow(x),
              "columns", ncol(x),
              "game_id_column", game_id_column,
              "unique_games", unique_games,
              "\n"
            )

            cat(
              "PRIMITIVE_COLUMNS",
              year,
              paste(matched, collapse = "|"),
              "\n"
            )
          }

      - name: Hash structural evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          records = []

          for p in sorted(Path("evidence").glob("*")):
              data = p.read_bytes()
              records.append({
                  "filename": p.name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          out = Path(
              "evidence/evidence_manifest.json"
          )

          out.write_text(
              json.dumps(
                  records,
                  indent=2,
                  sort_keys=True
              ) + "\n",
              encoding="utf-8",
          )

          print(
              "EVIDENCE_MANIFEST_SHA256",
              hashlib.sha256(out.read_bytes()).hexdigest()
          )
          PY

      - name: Upload compact structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-pbp-structure-2016-2025
          path: |
            out/pbp_byte_manifest_2016_2025.json
            evidence/
          if-no-files-found: error
          retention-days: 1
