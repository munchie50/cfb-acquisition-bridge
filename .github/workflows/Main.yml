name: CFB Semantic Canary Full-Season Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base

      - name: Acquire 2016-2025 primary PBP
        run: |
          set -euo pipefail
          mkdir -p raw evidence
          for YEAR in {2016..2025}; do
            curl --fail --location --retry 3 --output "raw/pbp_${YEAR}.rds" "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"
            test -s "raw/pbp_${YEAR}.rds"
          done

      - name: Audit football-event semantics across all development seasons
        shell: Rscript {0}
        run: |
          required <- c(
            "game_id","id_play","pos_team","def_pos_team","play_type","play_text",
            "down","distance","yards_gained","period","rush","pass","drive_id",
            "turnover","turnover_indicator","turnover_vec","downs_turnover",
            "interception_stat","interception_thrown_stat","fumble_stat",
            "fumble_recovered_stat","drive_result","drive_result_detailed",
            "yards_to_goal","yards_to_goal_end","down_end","pass_attempt","punt",
            "field_goal_missed_stat","field_goal_made_stat"
          )

          seasonal <- list()
          fourth_exceptions <- list()
          range_exceptions <- list()
          tod_exceptions <- list()
          turnover_semantics <- list()
          reproduction <- list()
          team_game_primitives <- list()
          primitive_integrity <- list()
          lineage_readiness <- list()

          for (year in 2016:2025) {
            x <- readRDS(sprintf("raw/pbp_%d.rds", year))
            missing <- setdiff(required, names(x))
            if (length(missing)) stop(paste(year, "missing required fields:", paste(missing, collapse=",")))

            one <- function(v) !is.na(v) & v == 1
            fourth_context <- !is.na(x$down) & x$down == 4
            scrimmage_flag <- one(x$rush) | one(x$pass) | one(x$pass_attempt)
            txt <- tolower(ifelse(is.na(x$play_text),"",as.character(x$play_text)))
            typ <- tolower(ifelse(is.na(x$play_type),"",as.character(x$play_type)))
            special_teams <- one(x$punt) |
              one(x$field_goal_missed_stat) | one(x$field_goal_made_stat) |
              grepl("punt|field goal|kickoff|extra point", txt) |
              grepl("punt|field goal|kickoff|extra point", typ)
            scrimmage_text <- grepl(" rush | pass | sacked| sack | kneel", paste0(" ",txt," "))
            fourth_attempt <- fourth_context & !special_teams & (scrimmage_flag | scrimmage_text)
            tod <- one(x$downs_turnover)
            gained_line <- !is.na(x$yards_gained) & !is.na(x$distance) & x$yards_gained >= x$distance
            int_evt <- one(x$interception_thrown_stat) | one(x$interception_stat)
            fum_rec <- one(x$fumble_recovered_stat)
            safety_evt <- grepl("safety", ifelse(is.na(x$drive_result_detailed),"",tolower(x$drive_result_detailed)))
            scoring_evt <- grepl("touchdown|field goal good", ifelse(is.na(x$drive_result_detailed),"",tolower(x$drive_result_detailed)))
            end_evt <- grepl("end half|end of game", ifelse(is.na(x$drive_result_detailed),"",tolower(x$drive_result_detailed)))

            fail_by_yards <- fourth_attempt & !gained_line
            alternate_terminal <- fail_by_yards & !tod & (int_evt | fum_rec | safety_evt | scoring_evt | end_evt)
            unexplained_fourth_failure <- fail_by_yards & !tod & !alternate_terminal

            neg_distance <- !is.na(x$distance) & x$distance < 0
            bad_ytg <- !is.na(x$yards_to_goal) & (x$yards_to_goal < 0 | x$yards_to_goal > 100)
            bad_ytg_end <- !is.na(x$yards_to_goal_end) & (x$yards_to_goal_end < 0 | x$yards_to_goal_end > 100)

            seasonal[[length(seasonal)+1]] <- data.frame(
              season=year, rows=nrow(x), games=length(unique(as.character(x$game_id))),
              fourth_context=sum(fourth_context), fourth_attempt=sum(fourth_attempt),
              downs_turnover=sum(tod),
              tod_not_fourth_attempt=sum(tod & !fourth_attempt),
              tod_special_teams=sum(tod & special_teams),
              tod_non_special_fourth=sum(tod & fourth_context & !special_teams),
              tod_gain_reaches_line=sum(tod & gained_line),
              fourth_fail_not_tod=sum(fail_by_yards & !tod),
              fourth_fail_alternate_terminal=sum(alternate_terminal),
              fourth_fail_unexplained=sum(unexplained_fourth_failure),
              interceptions=sum(one(x$interception_thrown_stat)),
              fumble_recoveries=sum(one(x$fumble_recovered_stat)),
              source_turnover=sum(one(x$turnover)),
              turnover_indicator=sum(one(x$turnover_indicator)),
              turnover_vec=sum(one(x$turnover_vec)),
              negative_distance=sum(neg_distance),
              yards_to_goal_out_of_range=sum(bad_ytg),
              yards_to_goal_end_out_of_range=sum(bad_ytg_end),
              stringsAsFactors=FALSE
            )

            tod_bad <- tod & (!fourth_attempt | gained_line)
            ix0 <- which(tod_bad)
            if (length(ix0)) {
              tod_exceptions[[length(tod_exceptions)+1]] <- data.frame(
                season=year, game_id=as.character(x$game_id[ix0]), id_play=as.character(x$id_play[ix0]),
                pos_team=as.character(x$pos_team[ix0]), def_pos_team=as.character(x$def_pos_team[ix0]),
                period=x$period[ix0], down=x$down[ix0], down_end=x$down_end[ix0],
                distance=x$distance[ix0], yards_gained=x$yards_gained[ix0],
                rush=x$rush[ix0], pass=x$pass[ix0], pass_attempt=x$pass_attempt[ix0],
                punt=x$punt[ix0], special_teams=special_teams[ix0], scrimmage_text=scrimmage_text[ix0],
                downs_turnover=x$downs_turnover[ix0],
                play_type=as.character(x$play_type[ix0]), play_text=as.character(x$play_text[ix0]),
                drive_result=as.character(x$drive_result[ix0]),
                drive_result_detailed=as.character(x$drive_result_detailed[ix0]),
                stringsAsFactors=FALSE
              )
            }

            # Event-first possession taxonomy. These categories are intentionally
            # mutually prioritized to prevent one football event being counted twice.
            interception_evt <- one(x$interception_thrown_stat) | one(x$interception_stat)
            fumble_evt <- one(x$fumble_stat) | one(x$fumble_recovered_stat) |
              grepl("fumble", txt) | grepl("fumble", typ)
            missed_fg_evt <- one(x$field_goal_missed_stat) | grepl("field goal.*miss|missed field goal", txt)
            punt_evt <- one(x$punt) | grepl("punt", typ)
            tod_candidate <- fourth_attempt & tod &
              !interception_evt & !fumble_evt & !missed_fg_evt & !punt_evt

            turnover_semantics[[length(turnover_semantics)+1]] <- data.frame(
              season=year,
              interceptions=sum(interception_evt),
              fumble_events=sum(fumble_evt),
              missed_field_goals=sum(missed_fg_evt),
              punts=sum(punt_evt),
              turnover_on_downs_candidates=sum(tod_candidate),
              candidate_overlap_interception=sum(tod_candidate & interception_evt),
              candidate_overlap_fumble=sum(tod_candidate & fumble_evt),
              candidate_overlap_missed_fg=sum(tod_candidate & missed_fg_evt),
              candidate_overlap_punt=sum(tod_candidate & punt_evt),
              stringsAsFactors=FALSE
            )

            # Deterministic raw-to-game reproduction sample. This proves the
            # aggregation mechanics only; it is not a fitted model feature.
            game_ids <- unique(as.character(x$game_id))
            sample_ids <- unique(game_ids[pmax(1, pmin(length(game_ids), c(1, ceiling(length(game_ids)/2), length(game_ids))))])
            for (gid in sample_ids) {
              g <- x[as.character(x$game_id) == gid, , drop=FALSE]
              teams <- unique(as.character(g$pos_team[!is.na(g$pos_team) & as.character(g$pos_team)!=""]))
              for (tm in teams) {
                team_rows <- as.character(g$pos_team) == tm
                opp_rows <- as.character(g$def_pos_team) == tm
                team_rows[is.na(team_rows)] <- FALSE
                opp_rows[is.na(opp_rows)] <- FALSE
                scrim <- (one(g$rush) | one(g$pass) | one(g$pass_attempt)) & !one(g$punt)
                reproduction[[length(reproduction)+1]] <- data.frame(
                  season=year, game_id=gid, team=tm,
                  source_row_count=nrow(g),
                  team_possession_rows=sum(team_rows),
                  opponent_possession_rows=sum(opp_rows),
                  team_scrimmage_plays=sum(team_rows & scrim),
                  opponent_scrimmage_plays=sum(opp_rows & scrim),
                  team_interceptions_thrown=sum(team_rows & (one(g$interception_thrown_stat) | one(g$interception_stat))),
                  team_fumble_event_rows=sum(team_rows & (one(g$fumble_stat) | grepl("fumble",tolower(ifelse(is.na(g$play_text),"",as.character(g$play_text)))))),
                  team_turnover_on_down_candidates=sum(team_rows & !one(g$punt) & !one(g$field_goal_missed_stat) &
                    one(g$downs_turnover) & !(one(g$interception_thrown_stat) | one(g$interception_stat)) &
                    !(one(g$fumble_stat) | one(g$fumble_recovered_stat))),
                  stringsAsFactors=FALSE
                )
              }
            }

            # Full team-game primitive table for strict prior-history lineage.
            all_game_ids <- unique(as.character(x$game_id))
            for (gid in all_game_ids) {
              g <- x[as.character(x$game_id) == gid, , drop=FALSE]
              teams <- unique(as.character(g$pos_team[!is.na(g$pos_team) & as.character(g$pos_team)!=""]))
              for (tm in teams) {
                team_rows <- as.character(g$pos_team) == tm
                team_rows[is.na(team_rows)] <- FALSE
                scrim <- (one(g$rush) | one(g$pass) | one(g$pass_attempt)) & !one(g$punt)
                team_game_primitives[[length(team_game_primitives)+1]] <- data.frame(
                  season=year, game_id=gid, team=tm,
                  primitive_scrimmage_plays=sum(team_rows & scrim),
                  primitive_interceptions=sum(team_rows & (one(g$interception_thrown_stat) | one(g$interception_stat))),
                  primitive_fumble_rows=sum(team_rows & (one(g$fumble_stat) | grepl("fumble",tolower(ifelse(is.na(g$play_text),"",as.character(g$play_text)))))),
                  primitive_tod_candidates=sum(team_rows & one(g$downs_turnover) & !one(g$punt) &
                    !one(g$field_goal_missed_stat) &
                    !(one(g$interception_thrown_stat) | one(g$interception_stat)) &
                    !(one(g$fumble_stat) | one(g$fumble_recovered_stat))),
                  stringsAsFactors=FALSE
                )
              }
            }

            ix <- which(unexplained_fourth_failure)
            if (length(ix)) {
              fourth_exceptions[[length(fourth_exceptions)+1]] <- data.frame(
                season=year, game_id=as.character(x$game_id[ix]), id_play=as.character(x$id_play[ix]),
                pos_team=as.character(x$pos_team[ix]), period=x$period[ix], down=x$down[ix],
                distance=x$distance[ix], yards_gained=x$yards_gained[ix],
                play_type=as.character(x$play_type[ix]), play_text=as.character(x$play_text[ix]),
                drive_result=as.character(x$drive_result[ix]),
                drive_result_detailed=as.character(x$drive_result_detailed[ix]),
                stringsAsFactors=FALSE
              )
            }

            ix2 <- which(neg_distance | bad_ytg | bad_ytg_end)
            if (length(ix2)) {
              range_exceptions[[length(range_exceptions)+1]] <- data.frame(
                season=year, game_id=as.character(x$game_id[ix2]), id_play=as.character(x$id_play[ix2]),
                play_type=as.character(x$play_type[ix2]), down=x$down[ix2], distance=x$distance[ix2],
                yards_to_goal=x$yards_to_goal[ix2], yards_to_goal_end=x$yards_to_goal_end[ix2],
                drive_result=as.character(x$drive_result[ix2]),
                drive_result_detailed=as.character(x$drive_result_detailed[ix2]),
                play_text=as.character(x$play_text[ix2]), stringsAsFactors=FALSE
              )
            }
          }

          seasonal <- do.call(rbind, seasonal)
          turnover_semantics <- do.call(rbind, turnover_semantics)
          reproduction <- do.call(rbind, reproduction)
          team_game_primitives <- do.call(rbind, team_game_primitives)
          key <- paste(team_game_primitives$season, team_game_primitives$game_id, team_game_primitives$team, sep="|")
          dup_keys <- duplicated(key) | duplicated(key, fromLast=TRUE)
          primitive_integrity[[1]] <- data.frame(
            rows=nrow(team_game_primitives),
            unique_keys=length(unique(key)),
            duplicate_key_rows=sum(dup_keys),
            negative_scrimmage=sum(team_game_primitives$primitive_scrimmage_plays < 0),
            negative_interceptions=sum(team_game_primitives$primitive_interceptions < 0),
            negative_fumble_rows=sum(team_game_primitives$primitive_fumble_rows < 0),
            negative_tod=sum(team_game_primitives$primitive_tod_candidates < 0),
            stringsAsFactors=FALSE
          )
          if (sum(dup_keys) != 0) stop("duplicate team-game primitive keys")
          primitive_integrity <- do.call(rbind, primitive_integrity)
          # Lineage join readiness: prove game IDs are stable and expose exactly
          # what this artifact still lacks. Do not invent timestamps from PBP.
          gid <- as.character(team_game_primitives$game_id)
          lineage_readiness[[1]] <- data.frame(
            primitive_rows=nrow(team_game_primitives),
            unique_game_ids=length(unique(gid)),
            missing_game_ids=sum(is.na(gid) | gid==""),
            duplicate_team_game_keys=sum(dup_keys),
            authoritative_game_timestamp_in_this_artifact=FALSE,
            prediction_cutoff_in_this_artifact=FALSE,
            join_key="game_id",
            required_external_authority="qualified schedule chronology / v0.23 temporal lineage",
            stringsAsFactors=FALSE
          )
          lineage_readiness <- do.call(rbind, lineage_readiness)
          write.csv(seasonal, "evidence/seasonal_semantic_audit.csv", row.names=FALSE)
          write.csv(turnover_semantics, "evidence/possession_event_taxonomy.csv", row.names=FALSE)
          write.csv(reproduction, "evidence/raw_to_game_reproduction_sample.csv", row.names=FALSE)
          write.csv(team_game_primitives, "evidence/team_game_primitives.csv", row.names=FALSE)
          write.csv(primitive_integrity, "evidence/team_game_primitive_integrity.csv", row.names=FALSE)
          write.csv(lineage_readiness, "evidence/lineage_join_readiness.csv", row.names=FALSE)

          if (length(tod_exceptions)) {
            write.csv(do.call(rbind,tod_exceptions), "evidence/downs_turnover_counterexamples.csv", row.names=FALSE)
          } else {
            write.csv(data.frame(), "evidence/downs_turnover_counterexamples.csv", row.names=FALSE)
          }

          if (length(fourth_exceptions)) {
            write.csv(do.call(rbind,fourth_exceptions), "evidence/fourth_down_unexplained.csv", row.names=FALSE)
          } else {
            write.csv(data.frame(), "evidence/fourth_down_unexplained.csv", row.names=FALSE)
          }

          if (length(range_exceptions)) {
            write.csv(do.call(rbind,range_exceptions), "evidence/range_exception_rows.csv", row.names=FALSE)
          } else {
            write.csv(data.frame(), "evidence/range_exception_rows.csv", row.names=FALSE)
          }

          # Discovery run: preserve counterexamples rather than abort before upload.
          # Promotion remains blocked whenever either counterexample count is nonzero.
          promotion_ready <- all(seasonal$tod_not_fourth_attempt == 0) &&
            all(seasonal$tod_gain_reaches_line == 0)

          contract <- list(
            derivation_version="semantic_canary_v0.11",
            seasons=2016:2025,
            promoted_semantics=list(
              FOURTH_DOWN_ATTEMPT="down==4, non-special-teams, with rush/pass/pass_attempt flag or explicit scrimmage text evidence"
            ),
            candidate_semantics=list(
              TURNOVER_ON_DOWNS="fourth-down attempt plus downs_turnover evidence after excluding higher-priority interception, fumble, missed-FG and punt events"
            ),
            possession_event_priority=c("INTERCEPTION","FUMBLE","MISSED_FIELD_GOAL","PUNT","TURNOVER_ON_DOWNS"),
            turnover_on_downs_promotion_ready=promotion_ready,
            not_promoted=c("turnover","turnover_indicator","turnover_vec","fumble_recovered_stat as lost-fumble identity"),
            rules=c(
              "fourth-down context alone is not an attempt",
              "turnover on downs is first-class and distinct from giveaways",
              "interception/fumble/safety/scoring/end-state fourth-down terminals are not double-counted as turnover on downs",
              "provider turnover composites remain evidence until separately adjudicated",
              "range anomalies remain applicability evidence until classified"
            ),
            fitting_performed=FALSE,tuning_performed=FALSE,test_outcome_optimization=FALSE
          )
          dput(contract,file="evidence/canary_contract_v05.dput")
          cat("V05_FULL_SEASON_SEMANTIC_AUDIT_PASS\n")

      - name: Validate and hash evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          e=Path("evidence")
          req=["seasonal_semantic_audit.csv","possession_event_taxonomy.csv","raw_to_game_reproduction_sample.csv","team_game_primitives.csv","team_game_primitive_integrity.csv","lineage_join_readiness.csv","downs_turnover_counterexamples.csv","fourth_down_unexplained.csv","range_exception_rows.csv","canary_contract_v05.dput"]
          for n in req:
              if not (e/n).is_file(): raise SystemExit(f"missing {n}")
          with (e/"seasonal_semantic_audit.csv").open() as f:
              rows=list(csv.DictReader(f))
          if len(rows)!=10: raise SystemExit("expected ten seasonal audit rows")
          records=[]
          for p in sorted(e.iterdir()):
              if p.is_file() and p.name!="evidence_manifest.json":
                  b=p.read_bytes()
                  records.append({"filename":p.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          m={"scope":"2016-2025 primitive lineage join readiness; authoritative chronology intentionally external","derivation_version":"semantic_canary_v0.11",
             "turnover_on_downs_semantic_promotion":False,"other_turnover_composites_promoted":False,
             "fitting_performed":False,"tuning_performed":False,"test_outcome_optimization":False,"records":records}
          out=e/"evidence_manifest.json"; out.write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print("EVIDENCE_MANIFEST_SHA256",hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: Upload v0.5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-semantic-canary-full-season-v11
          path: evidence/
          if-no-files-found: error
          retention-days: 1
