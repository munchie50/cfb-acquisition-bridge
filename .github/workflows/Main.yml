name: CFB PBP 2025 Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest

    steps:
      - name: Acquire original 2025 PBP bytes
        run: |
          mkdir -p out

          curl --fail --location --retry 3 \
            --output "out/play_by_play_2025.rds" \
            https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_2025.rds

      - name: Verify and manifest original bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("out/play_by_play_2025.rds")
          data = p.read_bytes()

          if len(data) == 0:
              raise RuntimeError("Downloaded PBP file is empty")

          manifest = {
              "source": "SportsDataverse/cfbfastR-data",
              "release": "cfbfastR_cfb_pbp",
              "season": 2025,
              "filename": p.name,
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
          }

          Path("out/pbp_manifest_2025.json").write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True
              ) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload PBP canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-pbp-2025-canary
          path: out/
          if-no-files-found: error
          retention-days: 1
