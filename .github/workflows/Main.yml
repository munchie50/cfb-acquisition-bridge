name: CFB Semantic Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base

      - name: Acquire primary PBP proof seasons
        run: |
          mkdir -p raw evidence
          for YEAR in 2017 2018 2022; do
            curl --fail --location --retry 3 \
              --output "raw/pbp_${YEAR}.rds" \
              "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"
          done

      - name: Prove football semantics and lineage inputs
        shell: Rscript {0}
        run: |
          dir.create(
            "evidence",
            showWarnings = FALSE
          )

          out <- list()
          k <- 0

          for (year in c(
            2017,
            2018,
            2022
          )) {

            x <- readRDS(
              sprintf(
                "raw/pbp_%d.rds",
                year
              )
            )

            need <- c(
              "game_id",
              "id_play",
              "pos_team",
              "def_pos_team",
              "play_type",
              "play_text",
              "down",
              "distance",
              "yards_gained",
              "period",
              "rush",
              "pass",
              "turnover",
              "turnover_indicator",
              "fumble_lost",
              "interception",
              "drive_id"
            )

            miss <- setdiff(
              need,
              names(x)
            )

            if (length(miss)) {
              stop(
                paste(
                  year,
                  "missing",
                  paste(
                    miss,
                    collapse = ","
                  )
                )
              )
            }

            # Preserve source semantics.
            #
            # A possession turnover is not automatically equivalent
            # to the narrower statistical giveaway category.
            #
            # Turnovers on downs are first-class football events and
            # must remain available to every feature family where
            # their football meaning is relevant.

            txt <- tolower(
              ifelse(
                is.na(x$play_text),
                "",
                as.character(x$play_text)
              )
            )

            typ <- tolower(
              ifelse(
                is.na(x$play_type),
                "",
                as.character(x$play_type)
              )
            )

            fourth_attempt <-
              !is.na(x$down) &
              x$down == 4 &
              (
                x$rush == 1 |
                x$pass == 1
              )

            # This is deliberately only a CANDIDATE classification.
            #
            # Final turnover-on-downs semantics must be validated
            # against the resulting possession / drive transition.
            #
            # We do not want a penalty, replayed down, or another
            # exceptional sequence to be silently promoted into a
            # true turnover on downs merely because text resembles
            # a failed fourth-down play.

            fourth_failure_text <-
              fourth_attempt &
              grepl(
                paste(
                  "turnover on downs",
                  "no gain",
                  "incomplete",
                  "sacked",
                  "loss of",
                  sep = "|"
                ),
                txt
              )

            interception_event <-
              (
                !is.na(x$interception) &
                x$interception == 1
              ) |
              grepl(
                "intercept",
                txt
              )

            lost_fumble_event <-
              !is.na(x$fumble_lost) &
              x$fumble_lost == 1

            # GIVEAWAY is intentionally narrower than the broader
            # possession-turnover concept.
            #
            # This preserves the conventional interception /
            # lost-fumble category without erasing turnovers on
            # downs from the football representation.

            giveaway_event <-
              interception_event |
              lost_fumble_event

            # Preserve the provider's broad turnover representation
            # as its own evidence instead of assuming what the field
            # means from its name.

            source_turnover <-
              (
                !is.na(x$turnover) &
                x$turnover == 1
              ) |
              (
                !is.na(x$turnover_indicator) &
                x$turnover_indicator == 1
              )

            missed_fg <-
              grepl(
                "field goal",
                txt
              ) &
              grepl(
                "miss|no good|blocked",
                txt
              )

            rows <-
              source_turnover |
              fourth_attempt |
              interception_event |
              lost_fumble_event |
              missed_fg

            z <- data.frame(
              season =
                year,

              game_id =
                as.character(
                  x$game_id[rows]
                ),

              id_play =
                as.character(
                  x$id_play[rows]
                ),

              pos_team =
                as.character(
                  x$pos_team[rows]
                ),

              def_pos_team =
                as.character(
                  x$def_pos_team[rows]
                ),

              period =
                x$period[rows],

              down =
                x$down[rows],

              distance =
                x$distance[rows],

              yards_gained =
                x$yards_gained[rows],

              play_type =
                as.character(
                  x$play_type[rows]
                ),

              play_text =
                as.character(
                  x$play_text[rows]
                ),

              source_turnover =
                source_turnover[rows],

              fourth_down_attempt =
                fourth_attempt[rows],

              fourth_down_failure_text_candidate =
                fourth_failure_text[rows],

              interception_event =
                interception_event[rows],

              lost_fumble_event =
                lost_fumble_event[rows],

              giveaway_event =
                giveaway_event[rows],

              missed_fg =
                missed_fg[rows],

              drive_id =
                as.character(
                  x$drive_id[rows]
                ),

              stringsAsFactors =
                FALSE
            )

            k <- k + 1
            out[[k]] <- z
          }

          e <- do.call(
            rbind,
            out
          )

          write.csv(
            e,
            "evidence/turnover_semantic_events.csv",
            row.names = FALSE
          )

          # Learn what the provider turnover fields actually cover.
          # Do not judge their semantics from their names alone.

          tab <- as.data.frame(
            with(
              e,
              table(
                source_turnover,
                fourth_down_attempt,
                interception_event,
                lost_fumble_event,
                missed_fg
              )
            )
          )

          write.csv(
            tab,
            "evidence/turnover_semantic_crosstab.csv",
            row.names = FALSE
          )

          examples <- e[
            e$source_turnover |
            e$giveaway_event |
            e$fourth_down_attempt |
            e$missed_fg,
          ]

          examples <- examples[
            order(
              examples$season,
              examples$game_id,
              examples$id_play
            ),
          ]

          write.csv(
            head(
              examples,
              500
            ),
            "evidence/semantic_examples.csv",
            row.names = FALSE
          )

          contract <- list(
            derivation_version =
              "semantic_canary_v0.2",

            principle =
              paste(
                "football event first,",
                "source representation second,",
                "feature aggregation third"
              ),

            primitives = c(
              "INTERCEPTION",
              "LOST_FUMBLE",
              "FOURTH_DOWN_ATTEMPT",
              "FOURTH_DOWN_FAILURE",
              "TURNOVER_ON_DOWNS",
              "MISSED_FIELD_GOAL",
              "SOURCE_POSSESSION_TURNOVER"
            ),

            aggregates = c(
              "GIVEAWAY",
              "POSSESSION_CHANGE"
            ),

            rules = c(
              paste(
                "turnover on downs is first-class",
                "and retained wherever football logic",
                "makes it relevant"
              ),

              paste(
                "giveaway is narrower than",
                "possession turnover"
              ),

              paste(
                "one event may have multiple semantic",
                "views but must not be double counted",
                "inside one aggregate"
              ),

              paste(
                "preserve fourth-down distance,",
                "field position, period, score and",
                "drive context when available"
              ),

              paste(
                "do not infer final fourth-down failure",
                "solely from the text candidate without",
                "possession or next-play validation"
              )
            ),

            fitting_performed =
              FALSE,

            tuning_performed =
              FALSE,

            test_outcome_optimization =
              FALSE
          )

          dput(
            contract,
            file =
              "evidence/canary_contract_v02.dput"
          )

      - name: Freeze evidence hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          records = []

          for p in sorted(
              Path("evidence").rglob("*")
          ):
              if (
                  p.is_file()
                  and
                  p.name != "evidence_manifest.json"
              ):
                  b = p.read_bytes()

                  records.append({
                      "filename":
                          str(
                              p.relative_to(
                                  "evidence"
                              )
                          ),
                      "bytes":
                          len(b),
                      "sha256":
                          hashlib.sha256(
                              b
                          ).hexdigest(),
                  })

          manifest = {
              "scope":
                  "CFB semantic canary football-event proof",

              "derivation_version":
                  "semantic_canary_v0.2",

              "fitting_performed":
                  False,

              "tuning_performed":
                  False,

              "test_outcome_optimization":
                  False,

              "records":
                  records,
          }

          out = Path(
              "evidence/evidence_manifest.json"
          )

          out.write_text(
              json.dumps(
                  manifest,
                  indent = 2,
                  sort_keys = True
              ) + "\n",
              encoding = "utf-8"
          )

          print(
              "EVIDENCE_MANIFEST_SHA256",
              hashlib.sha256(
                  out.read_bytes()
              ).hexdigest()
          )
          PY

      - name: Upload semantic canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-semantic-canary-football-semantics
          path: evidence/
          if-no-files-found: error
          retention-days: 1
