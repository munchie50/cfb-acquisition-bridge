name: CFB Week10 bounded normalizer validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cfb_cbs_full_board_normalizer.py'
      - 'scripts/test_cfb_week10_full_board_normalizer.py'
      - 'evidence/operational/CFB_WEEK10_CANDIDATE_CANONICAL_IDENTITY_BASELINE_20261031.json'
      - 'evidence/operational/CFB_CBS_WEEK10_LIVE_MARKDOWN_CAPTURE_20261031.md'
      - '.github/workflows/cfb_week10_normalizer_validation.yml'
      - 'scripts/cfb_week10_fallback_branch_inventory.py'
      - 'scripts/test_cfb_week10_fallback_branch_inventory.py'
      - 'scripts/cfb_covers_matchup_shadow.py'
      - 'scripts/cfb_week10_covers_gap_report.py'
      - 'evidence/operational/CFB_BETSHARP_WEEK10_NOV7_DISCOVERY_URLS_20261031.txt'
      - 'scripts/cfb_betsharp_week10_shadow.py'
      - 'scripts/test_cfb_betsharp_week10_shadow.py'
      - 'scripts/cfb_betsharp_week10_market_shadow.py'
      - 'scripts/test_cfb_betsharp_week10_market_shadow.py'
      - 'scripts/test_cfb_covers_matchup_shadow.py'
jobs:
  bounded-week10-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Week10 actual normalizer regression
        run: python -m unittest discover -s scripts -p 'test_cfb_week10_full_board_normalizer.py' -v
      - name: Verify explicit missing-game acquisition frontier
        run: python -m unittest discover -s scripts -p 'test_cfb_week10_fallback_branch_inventory.py' -v
      - name: Test alternate Covers source qualification boundary
        run: python -m unittest discover -s scripts -p 'test_cfb_covers_matchup_shadow.py' -v
      - name: Test BetSharp market side extraction boundary
        run: python -m unittest discover -s scripts -p 'test_cfb_betsharp_week10_market_shadow.py' -v
      - name: Execute six-branch shadow inventory
        run: python scripts/cfb_week10_fallback_branch_inventory.py > week10_fallback_inventory.json
      - name: Reconcile observed Covers moneyline pair identities against CBS gaps
        run: python scripts/cfb_week10_covers_gap_report.py > week10_covers_gap_report.json
      - name: Test BetSharp bounded source discovery
        run: python -m unittest discover -s scripts -p 'test_cfb_betsharp_week10_shadow.py'
      - name: Assert unpriced game acquisition priority
        run: |
          python -c 'import json; r=json.load(open("week10_covers_gap_report.json")); assert r["source_incremental_yield"]=="ZERO"; assert r["unpriced_games_count"]==46; assert len(r["unpriced_games_priority_queue"])==46; assert not r["decision_authorized"]'
      - name: Validate current capture provenance
        run: |
          python -c 'import json; b=json.load(open("week10_fallback_inventory.json")); assert b["recovery_bound_not_exact_fetch"] is True; assert b["executability"]=="UNVERIFIED"; assert b["consensus"]=="UNAVAILABLE"; print("SHADOW_ONLY: historical capture cannot authorize current wagers")'
      - name: Export bounded acquisition queue
        run: |
          python -c 'import json; b=json.load(open("week10_fallback_inventory.json")); assert not b["decision_authorized"]; q=b["acquisition_queue"]; assert len(q)==46; assert sum(len(x["missing_branches"]) for x in q)==276; json.dump({"status":"ACQUISITION_TARGETS_ONLY","source":b["source"],"decision_authorized":False,"games":len(q),"missing_branches":276,"targets":q},open("week10_acquisition_queue.json","w"),indent=2)'
      - name: Export bounded BetSharp candidate intersection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from cfb_betsharp_week10_shadow import discover
          queue = json.load(open("week10_acquisition_queue.json"))["targets"]
          result = discover(open("evidence/operational/CFB_BETSHARP_WEEK10_NOV7_DISCOVERY_URLS_20261031.txt").read(), queue)
          assert result["source_urls_count"] == 111
          assert result["mascot_prefix_candidate_count"] > 0
          assert result["unmatched_unpriced_games_count"] < 46
          print("BETSHARP_DISCOVERY", json.dumps({"source_urls":result["source_urls_count"],"candidate_unpriced_games":result["mascot_prefix_candidate_count"],"unmatched_unpriced_games":result["unmatched_unpriced_games_count"],"candidate_game_ids":[r["game_id"] for r in result["mascot_prefix_candidates"]],"decision_authorized":result["decision_authorized"]},sort_keys=True))
          assert result["decision_authorized"] is False
          json.dump(result, open("week10_betsharp_shadow_candidates.json", "w"), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: week10-fallback-branch-inventory
          path: |
            week10_fallback_inventory.json
            week10_acquisition_queue.json
            week10_covers_gap_report.json
            week10_betsharp_shadow_candidates.json
          retention-days: 14
