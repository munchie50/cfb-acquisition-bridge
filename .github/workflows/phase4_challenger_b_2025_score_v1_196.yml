name: CFB Phase4 Challenger B 2025 Outcome Score v1.196
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase4_challenger_b_2025_score_v1_196.py'
      - '.github/workflows/phase4_challenger_b_2025_score_v1_196.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Acquire canonical frozen predictions
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir frozen raw out
          gh api repos/${{ github.repository }}/actions/artifacts/10896494289/zip > /tmp/frozen.zip
          echo "386facc0452a2a8a4914d178cac6dc0c75db4bc30ff8f023c212f8eaac678038  /tmp/frozen.zip" | sha256sum -c -
          unzip -q /tmp/frozen.zip -d frozen
      - name: Acquire 2025 outcome source
        run: |
          curl --fail --location --retry 3 -o raw/cfb_schedules_2025.parquet "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-cfb-data/main/cfb/cfb_schedules/parquet/cfb_schedules_2025.parquet"
          test -s raw/cfb_schedules_2025.parquet
          sha256sum raw/cfb_schedules_2025.parquet
      - name: Compile gate
        run: python -m py_compile scripts/phase4_challenger_b_2025_score_v1_196.py
      - name: Score frozen predictions
        run: python scripts/phase4_challenger_b_2025_score_v1_196.py frozen raw/cfb_schedules_2025.parquet out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-phase4-challenger-b-2025-outcome-score-v1-196
          path: out/
