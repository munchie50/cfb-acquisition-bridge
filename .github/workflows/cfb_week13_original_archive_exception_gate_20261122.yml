name: CFB Week13 original archive identity exception executable gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cfb_week13_original_archive_exception_gate_20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-archive-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch original September engine archive and retained CBS Week13 identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/cbs"
          gh api repos/${{ github.repository }}/actions/artifacts/10897612260/zip > "$RUNNER_TEMP/original.zip"
          gh api repos/${{ github.repository }}/actions/artifacts/14771846354/zip > "$RUNNER_TEMP/cbs.zip"
          python -m zipfile -e "$RUNNER_TEMP/original.zip" "$RUNNER_TEMP/original"
          python -m zipfile -e "$RUNNER_TEMP/cbs.zip" "$RUNNER_TEMP/cbs"
      - name: Independently inspect archive contents and exact exception identities
        run: |
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          import csv,io
          original=base/'original'
          manifest_files=list(original.rglob('manifest_v1_206.json'))
          assert len(manifest_files)==1, 'original archive manifest missing or ambiguous'
          manifest=json.loads(manifest_files[0].read_text())
          assert manifest['target_games']==622 and manifest['status']=='EXECUTED_NOT_ACCEPTED'
          for filename,expected_sha in manifest['hashes'].items():
            candidates=list(original.rglob(filename))
            assert len(candidates)==1, ('original manifest member missing or ambiguous',filename)
            actual=hashlib.sha256(candidates[0].read_bytes()).hexdigest()
            assert actual==expected_sha, ('original manifest hash mismatch',filename)
          ledgers=list(original.rglob('challenger_b_2026_target_ledger_v1_206.csv'))
          assert len(ledgers)==1
          with ledgers[0].open(newline='') as fh:
            rows=list(csv.DictReader(fh))
          assert len(rows)==622 and len({r['game_id'] for r in rows})==622
          print('PASS: original September artifact directly verified: manifest, five SHA-256 file hashes, 622 unique target game IDs')
          print('HOLD: original September target ledger is historical evidence, NOT a Week13 schedule or prediction freeze')
          ids=json.loads(next((base/'cbs').rglob('identity.json')).read_text())
          assert ids['source_sha256']=='f2319f9354cc3fd5dac23edd328740fb62fb24e98fd75b20e1dfda38d0a6b695'
          games=ids['games']
          assert len(games)==69 and len({g['cbs_id'] for g in games})==69
          expected={'50052031':'NCAAF_20261128_BOISE@COLOST',
                    '50052032':'NCAAF_20261128_SDGST@WASHST',
                    '50052033':'NCAAF_20261128_TXSTSM@UTAHST',
                    '50052034':'NCAAF_20261128_OREGST@FRESNO'}
          assert ids['status']=='QA_ONLY'
          assert ids['original_lineage_accepted'] is False
          assert ids['canonical_publication_eligible'] is False
          assert ids['wager_eligible'] is False
          found={g['cbs_id']:g for g in games}
          exact_teams={
            '50052031':['Boise St.','Colorado St.'],
            '50052032':['San Diego St.','Washington St.'],
            '50052033':['Texas St.','Utah St.'],
            '50052034':['Oregon State','Fresno St.']
          }
          for gid,abbrev in expected.items():
            assert found[gid]['cbs_abbrev']==abbrev,(gid,found.get(gid))
            assert found[gid]['teams']==exact_teams[gid],('CBS team-direction drift',gid,found[gid])
          historical={r['game_id']:r for r in rows}
          conflicts={
            '50052031':('401860911','Colorado State','Boise State','2026-11-07 23:00:00+00:00','same-direction-old-clock'),
            '50052032':('401860909','San Diego State','Washington State','2026-10-31 23:00:00+00:00','reversed-old-clock'),
            '50052033':('401860906','Texas State','Utah State','2026-10-24 23:30:00+00:00','reversed-old-clock'),
            '50052034':('401860924','Fresno State','Oregon State','2026-10-31 04:00:00+00:00','same-direction-old-clock')
          }
          for cbs_id,(old_id,old_home,old_away,old_clock,classification) in conflicts.items():
            old=historical[old_id]
            assert (old['home_team'],old['away_team'],old['start_date'])==(old_home,old_away,old_clock),(cbs_id,old)
            assert cbs_id not in historical,'CBS Week13 identity unexpectedly collides with original ledger'
            assert old_id!=cbs_id
            assert classification in ('same-direction-old-clock','reversed-old-clock')
          print('PASS: four historical original IDs, exact clocks, and home/away directions independently confirmed; no cross-week ID substitution')
          print('PASS: 69 retained CBS directed game IDs and four exact exception identifiers verified against original source artifacts')
          print('HOLD: archive kickoff/date reconciliation remains QA-only, no profile activation')
          PY
