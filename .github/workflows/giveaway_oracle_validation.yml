name: CFB Giveaway Oracle Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/giveaway_oracle_validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned upstream fixture files
        run: |
          set -euo pipefail
          mkdir evidence
          base=https://raw.githubusercontent.com/sportsdataverse/cfbfastR/006729304e8b7b6ec392dff93cfd0b649e741675/tests/testthat/fixtures/parity
          curl -L --fail -o box.parquet "$base/boxparity_box.parquet"
          curl -L --fail -o pbp.parquet "$base/boxparity_pbp.parquet"
          sha256sum box.parquet pbp.parquet > evidence/input_sha256.txt
      - name: Validate pinned giveaway aggregate against independent ESPN controls
        run: |
          python -m pip install --quiet pandas pyarrow
          python - <<'PY'
          import pandas as pd
          p=pd.read_parquet("pbp.parquet"); b=pd.read_parquet("box.parquet")
          p["game_id"]=p["fixture_game_id"].astype(str); b["game_id"]=b["fixture_game_id"].astype(str)
          b["team_key"]=b["team_key"].astype(str)
          pos=("pos_team_id" if "pos_team_id" in p else "pos_team")
          p["team_key"]=p[pos].astype("string")
          def flag(n):
              if n not in p: return pd.Series(0,index=p.index,dtype="int64")
              return (pd.to_numeric(p[n],errors="coerce").fillna(0)>0).astype(int)
          off=pd.DataFrame({"game_id":p.game_id,"team_key":p.team_key,
                            "interceptions":flag("int"),"fumbles_lost":flag("fumble_lost")})
          off=off[off.team_key.notna()]
          a=off.groupby(["game_id","team_key"],as_index=False)[["interceptions","fumbles_lost"]].sum()
          a["turnovers"]=a.interceptions+a.fumbles_lost
          j=a.merge(b,on=["game_id","team_key"],how="left",indicator=True)
          rows=[]
          for s,bs in [("interceptions","espn_interceptions"),("fumbles_lost","espn_fumbles_lost"),("turnovers","espn_turnovers")]:
              ok=j[bs].notna()
              rows.append({"stat":s,"n":int(ok.sum()),"matched":int((j.loc[ok,s]==pd.to_numeric(j.loc[ok,bs],errors="coerce")).sum()),"rate":float((j.loc[ok,s]==pd.to_numeric(j.loc[ok,bs],errors="coerce")).mean())})
          pd.DataFrame(rows).to_csv("evidence/parity.csv",index=False)
          # denominator audit
          bk=set(zip(b.game_id,b.team_key)); ak=set(zip(a.game_id,a.team_key))
          miss=b[[ (g,t) not in ak for g,t in zip(b.game_id,b.team_key)]]
          miss.to_csv("evidence/unmatched_box_team_games.csv",index=False)
          pd.DataFrame([{"aggregate_rows":len(a),"box_rows":len(b),"unmatched_box_rows":len(miss),"aggregate_games":a.game_id.nunique(),"box_games":b.game_id.nunique()}]).to_csv("evidence/denominator.csv",index=False)
          print(pd.DataFrame(rows)); print("denominator",len(a),len(b),len(miss))
          PY
      - name: Hash evidence
        run: cd evidence && sha256sum *.csv >> input_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-giveaway-oracle-validation
          path: evidence/
          retention-days: 3
