name: CFB Week9 one-time guarded recovery pointer integration
on:
  push:
    branches: [rescue/week9-git-runtime-20261030]
    paths: ['.github/workflows/cfb_week9_r21_index_pointer_repair_once.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: cfb-week9-one-time-index-pointer-repair
  cancel-in-progress: false
jobs:
  repair-only:
    if: false # completed once at main 76839a44; never rerun the mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact current main (not rescue branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Assert single stale binding and prepare append-only index
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ef26e66904a163b1c5baec4bd14e6625915e8ab8"
          test "$(git hash-object evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md)" = "379eff0dfd4b7184633d0962e0a37b615384573e"
          test "$(git hash-object evidence/operational/CFB_ACCEPTED_PREDICTION_SOURCE_STATE.json)" = "42c6fed3dee79be8693d6750122ae08beeb24e3a"
          python - <<'PY'
          import sys,json,datetime,subprocess,pathlib,hashlib
          sys.path.insert(0,'scripts')
          from cfb_recovery_navigation_reader import read
          from cfb_recovery_consumer_preflight import audit
          p=pathlib.Path('evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md')
          original=p.read_text()
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          parsed=read(original,now)
          frontier=parsed['frontier']
          pointers=frontier['pointers']
          assert len(pointers)==333 and len({x['path'] for x in pointers})==333
          stale=[]
          for pointer in pointers:
              actual=subprocess.check_output(['git','hash-object',pointer['path']],text=True).strip()
              if actual!=pointer['blob']:
                  stale.append((pointer['path'],pointer['blob'],actual))
          expected=('evidence/operational/CFB_ACCEPTED_PREDICTION_SOURCE_STATE.json',
                    '467e21006cc51fcc46b9577d7f98f301f9e63f84',
                    '42c6fed3dee79be8693d6750122ae08beeb24e3a')
          assert stale==[expected],f'unexpected pointer drift: {stale}'
          updated=[dict(x) for x in pointers]
          target=next(x for x in updated if x['path']==expected[0])
          target['blob']=expected[2]
          target['purpose']='ACCEPTED_OCT27_PREDICTION_SOURCE_POINTER:independentlyauditedsourceonly;notnewChampiondecisionsorbetapproval'
          nxt={'schema':'CFB_RECOVERY_NAVIGATION_FRONTIER_V1',
               'as_of_utc':now,'scope':'NAVIGATION_ONLY_NOT_AUTHORITY',
               'claims':['One-pointer integration repair for independently accepted Oct27 prediction-source pointer; all other 332 bindings preserved.',
                         'This navigation correction is not a current Week9 Champion six-market decision, prospective packet certification, executable sportsbook offer, new Hot Sheet, or wager approval.',
                         'R20 RUN_INCOMPLETE remains authoritative until genuine producer acceptance and independent readback.'],
               'pointers':updated}
          proposed=original+'\n\x60\x60\x60cfb-frontier-json\n'+json.dumps(nxt,indent=2)+'\n\x60\x60\x60\n'
          assert proposed.startswith(original)
          p.write_text(proposed)
          def loader(path):return pathlib.Path(path).read_text()
          result=audit(proposed,loader,now)
          assert result['verified_pointers']==333
          assert read(proposed,now)['checkpoint_count']==parsed['checkpoint_count']+1
          print(json.dumps({'status':'PREPARED_NOT_YET_COMMITTED','prior_blob':parsed['index_blob'],
                            'new_index_blob':result['index_blob'],'pointer_count':333,
                            'corrected_path':expected[0],'preflight':result['verdict']}))
          PY
          python scripts/cfb_recovery_consumer_preflight.py --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
          test "$(git diff --name-only | wc -l)" -eq 1
          test -z "$(git diff --cached --name-only)"
          git diff --name-only | grep -Fx 'evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md'
      - name: Guarded serial commit and push to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "ef26e66904a163b1c5baec4bd14e6625915e8ab8"
          git config user.name "cfb-week9-recovery-bot"
          git config user.email "cfb-week9-recovery-bot@users.noreply.github.com"
          git add -- evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
          git commit -m "CFB Week9: guarded one-pointer Oct27 recovery navigation integration"
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "POINTER_REPAIR_PUSH_READBACK_PASS $(git rev-parse HEAD)"
      - name: Record independent-reconciliation inputs (not publication acceptance)
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short
          git hash-object evidence/operational/CFB_ACCEPTED_PREDICTION_SOURCE_STATE.json
          git hash-object evidence/operational/CFB_MARKET_MONITOR_STATE.md
          git hash-object evidence/operational/CFB_DECISION_WAIT_LEDGER.md
          git hash-object evidence/operational/CFB_WEEK9_HOT_SHEET_2026-10-29_2008CT.md
  dispatch-selected-existing-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Guard corrected main before requesting existing static CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/git/refs/heads/main --jq .object.sha)" = "76839a44d4da9630d761378f6759e51b75be5953"
          test "$(gh api repos/${{ github.repository }}/git/trees/main --jq '.tree[] | select(.path=="evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md") | .sha')" = "57327859afb17ca42451189d3661f4c16fae4f90"
          gh api -X POST repos/${{ github.repository }}/actions/workflows/cfb_qa_hot_sheet_kickoff_section_static_gate.yml/dispatches -f ref=main
          echo "EXISTING_STATIC_CI_DISPATCH_REQUESTED_NOT_YET_ACCEPTED"
