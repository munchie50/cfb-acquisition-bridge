name: CFB Phase4 Feature Canary v1.108
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R
        run: sudo apt-get update && sudo apt-get install -y r-base
      - name: Acquire TRAIN VALIDATION PBP only
        run: |
          mkdir -p raw
          for YEAR in {2016..2024}; do
            curl --fail --location --retry 3 --output "raw/pbp_${YEAR}.rds" "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"
          done
      - name: Require qualified schedule input
        run: |
          test -s evidence/phase4_qualified_schedule_2016_2024.csv || { echo "qualified schedule artifact absent; fail closed"; exit 2; }
      - name: Run frozen mechanical feature canary
        run: Rscript scripts/phase4_feature_canary_v1_108.R raw evidence/phase4_qualified_schedule_2016_2024.csv
      - name: Assert TEST excluded
        run: |
          ! grep -q '^2025,' phase4_feature_canary_v1_108.csv
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-phase4-feature-canary-v1-108
          path: |
            phase4_team_game_mechanical_primitives_v1_108.csv
            phase4_feature_canary_v1_108.csv
