name: CFB Phase4 Challenger A Future Sentinel QA v1.139
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase4_challenger_a_future_sentinel_qa_v1_139.py'
      - '.github/workflows/phase4_challenger_a_future_sentinel_qa_v1_139.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas
      - name: Download frozen accepted dataset
        run: |
          curl -L --fail -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -o freeze.zip https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10893287560/zip
          unzip -q freeze.zip
      - name: Verify frozen identities
        run: |
          echo "17939728b9939e9b2b2f11f02da0b449656c0a01034c954d4e5d0f6655509053  phase4_challenger_a_dataset_v1_131.csv" | sha256sum -c -
          echo "fbcca938b75d3c151cd8ad8547c24ddecc6bd86b02030495d65da240a6df63a7  phase4_challenger_a_config_v1_131.json" | sha256sum -c -
      - run: python scripts/phase4_challenger_a_future_sentinel_qa_v1_139.py
