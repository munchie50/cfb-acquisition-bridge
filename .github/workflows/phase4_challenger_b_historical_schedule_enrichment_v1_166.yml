name: CFB Phase4 Challenger B Historical Schedule Enrichment v1.166
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase4_challenger_b_historical_schedule_enrichment_v1_166.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas pyarrow
      - name: Download accepted population
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir population source
          gh api repos/${{ github.repository }}/actions/artifacts/10893997859/zip > /tmp/p.zip
          unzip -q /tmp/p.zip -d population
      - name: Acquire same-lineage historical schedules and project scores
        run: |
          for YEAR in {2016..2024}; do
            curl --fail --location --retry 3 --output "source/cfb_schedules_${YEAR}.parquet" "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_schedules/cfb_schedules_${YEAR}.parquet"
          done
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for y in range(2016,2025):
              d=pd.read_parquet(f"source/cfb_schedules_{y}.parquet")
              cols=["game_id"]+[c for c in ["home_points","away_points","home_score","away_score"] if c in d.columns]
              d[cols].to_csv(f"source/schedule_{y}.csv",index=False)
          PY
      - run: python scripts/phase4_challenger_b_historical_schedule_enrichment_v1_166.py population source out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cfb-phase4-challenger-b-historical-schedule-v1-166, path: out/}
