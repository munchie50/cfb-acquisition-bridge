name: CFB QA Sandbox Historical Outcome Score 2026-09-28
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb_qa_sandbox_outcome_score_2026_09_28.yml'
permissions:
  contents: read
  actions: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Acquire immutable prediction and outcome authorities
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          mkdir -p frozen dataset out
          gh api repos/${{ github.repository }}/actions/artifacts/10970862853/zip > /tmp/freeze.zip
          echo "8955c64f72ea8068279aed3b4ac1f062200394fbc1eb278cb1864de4da9fe5c9  /tmp/freeze.zip" | sha256sum -c -
          unzip -q /tmp/freeze.zip -d frozen
          gh api repos/${{ github.repository }}/actions/artifacts/10896565577/zip > /tmp/v179.zip
          echo "8eeb67f5da87df4a75f2f785838553679928e370eefeea3945f2b2e688e69780  /tmp/v179.zip" | sha256sum -c -
          unzip -q /tmp/v179.zip -d dataset
          P="$(find frozen -name sandbox_candidate_predictions.csv)"
          D="$(find dataset -name challenger_b_dataset_v1_179.csv)"
          test "$(printf '%s\n' "$P" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$D" | grep -c .)" -eq 1
          echo "ed858f1bd72decd93d02aec4de507c3217470b8d01294c2cf677a2d79ed78ee3  $P" | sha256sum -c -
          echo "f8c479c83abf5dac3be6dcb4bba3d6a0996ae2623297a9a3514465824b7c4af8  $D" | sha256sum -c -
      - name: Verify pinned scorer identity
        run: |
          set -euo pipefail
          echo "0a229ddb38304b38e366853f6b8a095e8008970f16f2620c55805ecf28d61b23  scripts/cfb_qa_sandbox_outcome_score_2026_09_28.py" | sha256sum -c -
          test "$(git hash-object scripts/cfb_qa_sandbox_outcome_score_2026_09_28.py)" = "2336002317b4ba0a73acb5c012884f34c6999c67"
          python -m py_compile scripts/cfb_qa_sandbox_outcome_score_2026_09_28.py
      - name: Score immutable predictions
        run: |
          set -euo pipefail
          P="$(find frozen -name sandbox_candidate_predictions.csv)"
          D="$(find dataset -name challenger_b_dataset_v1_179.csv)"
          python scripts/cfb_qa_sandbox_outcome_score_2026_09_28.py "$P" "$D" out
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-qa-sandbox-historical-outcome-score-2026-09-28
          path: out/
          if-no-files-found: error
