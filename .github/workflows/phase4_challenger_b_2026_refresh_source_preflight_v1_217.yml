name: CFB Phase4 Challenger B 2026 Refresh Source Preflight v1.217
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase4_challenger_b_2026_refresh_source_preflight_v1_217.py'
      - '.github/workflows/phase4_challenger_b_2026_refresh_source_preflight_v1_217.yml'
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas pyarrow pyreadr
      - run: |
          mkdir raw out
          curl --fail --location --retry 3 -o raw/s.parquet "https://raw.githubusercontent.com/sportsdataverse/cfbfastR-cfb-data/main/cfb/cfb_schedules/parquet/cfb_schedules_2026.parquet"
          curl --fail --location --retry 3 -o raw/p.rds "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_2026.rds"
      - run: python -m py_compile scripts/phase4_challenger_b_2026_refresh_source_preflight_v1_217.py
      - run: python scripts/phase4_challenger_b_2026_refresh_source_preflight_v1_217.py raw/s.parquet raw/p.rds out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-phase4-challenger-b-2026-refresh-source-preflight-v1-217
          path: out/
