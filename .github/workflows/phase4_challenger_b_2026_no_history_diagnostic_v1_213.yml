name: CFB Phase4 Challenger B 2026 No-History Diagnostic v1.213
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase4_challenger_b_2026_no_history_diagnostic_v1_213.py'
      - '.github/workflows/phase4_challenger_b_2026_no_history_diagnostic_v1_213.yml'
permissions: {contents: read, actions: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir art out
          gh api repos/${{ github.repository }}/actions/artifacts/10897612260/zip > /tmp/a.zip
          echo "772b8683365ebf62d35fc3813beb138688b84af4172a0b261fd9218691d5adcf  /tmp/a.zip" | sha256sum -c -
          unzip -q /tmp/a.zip -d art
      - run: python -m py_compile scripts/phase4_challenger_b_2026_no_history_diagnostic_v1_213.py
      - run: python scripts/phase4_challenger_b_2026_no_history_diagnostic_v1_213.py art out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-phase4-challenger-b-2026-no-history-diagnostic-v1-213
          path: out/
