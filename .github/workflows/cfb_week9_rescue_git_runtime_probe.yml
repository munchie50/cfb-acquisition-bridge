name: CFB Week9 Production Rescue - Git Runtime Evidence
on:
  push:
    branches: [rescue/week9-git-runtime-20261030]
    paths:
      - '.github/workflows/cfb_week9_rescue_git_runtime_probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  production-runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated rescue branch without modifying production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned main ancestor and accepted canonical objects
        shell: bash
        run: |
          set -euo pipefail
          PIN=ab98e454f19c059618491dfe1881b31890756c2b
          git cat-file -e "${PIN}^{commit}"
          git merge-base --is-ancestor "$PIN" HEAD
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git hash-object evidence/operational/CFB_MARKET_MONITOR_STATE.md)" = 69caf5b1184eedccc90be7562e4a3bd7cb8b7375
          test "$(git hash-object evidence/operational/CFB_DECISION_WAIT_LEDGER.md)" = bb5a9cc83b6a1425dc2972ca84b33aa2bbbf8fa9
          test "$(git hash-object evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md)" = 379eff0dfd4b7184633d0962e0a37b615384573e
          test "$(git hash-object evidence/operational/CFB_WEEK9_HOT_SHEET_2026-10-29_2008CT.md)" = f05173046e51ab9634d47b1be5fe90c2a5026c96
          echo "PINNED_FULL_HISTORY_AND_CANONICAL_BLOBS_PASS"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute governed independent Git runtime and immutable ancestry check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_runtime_checkout.py --destination "$RUNNER_TEMP/cfb-full-clone" --expected-head ab98e454f19c059618491dfe1881b31890756c2b > "$RUNNER_TEMP/runtime_result.json"
          python - "$RUNNER_TEMP/runtime_result.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='SUPPORTED_GIT_RUNTIME_VERIFIED'
          print('SUPPORTED_GIT_RUNTIME_VERIFIED',x['head'],'immutable_reviews',len(x['immutable_reviews']))
          PY
      - name: Execute existing production recovery consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_recovery_consumer_preflight.py --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
      - name: Normalize live Friday public CBS source against 56 authentic Week9 identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:evidence/operational/CFB_FRIDAY_20261030_LATE_CBS_PUBLIC_BOARD_CAPTURE.md > "$RUNNER_TEMP/cfb-late-cbs.md"
          python scripts/cfb_cbs_full_board_normalizer.py \
            --markdown "$RUNNER_TEMP/cfb-late-cbs.md" \
            --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json \
            --recovered-by 2026-10-30T23:43:31.761Z \
            --profile WEEK9 --output "$RUNNER_TEMP/cfb-late-cbs-normalized.json"
          python - "$RUNNER_TEMP/cfb-late-cbs-normalized.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          c=d['coverage']
          assert c['governed_games']==56 and c['matched_games']==56 and not c['missing_game_ids']
          print('FRESH_PUBLIC_BOARD_IDENTITY_COVERAGE_PASS',c)
          print('RESEARCH_ONLY_NO_NEW_CHAMPION_DECISIONS')
          PY
      - name: Preserve normalized live public board as replayable research artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week9-20261030-2343z-public-board-normalized
          path: ${{ runner.temp }}/cfb-late-cbs-normalized.json
          retention-days: 14
          if-no-files-found: error
      - name: Normalize newly captured CBS Week9 rescue board against canonical identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_cbs_full_board_normalizer.py \
            --markdown evidence/operational/CFB_WEEK9_LIVE_CBS_CAPTURE_20261030_RESCUE.md \
            --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json \
            --recovered-by 2026-10-30T23:58:00Z \
            --profile WEEK9 --output "$RUNNER_TEMP/cfb-new-rescue-board.json"
          python - "$RUNNER_TEMP/cfb-new-rescue-board.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))['coverage']
          assert x['governed_games']==56 and x['matched_games']==56 and not x['missing_game_ids']
          print('NEW_RESCUE_BOARD_56_GAME_IDENTITY_PASS',x)
          PY
      - name: Verify authentic Week9 producer compiler and publication rejection controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_cfb_week9_*.py' -v
          echo "WEEK9_PRODUCER_CONTRACT_TESTS_COMPLETE_NO_PUBLICATION"
      - name: Execute authentic Week9 canonical readiness and full-coverage audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_hot_sheet_readiness.py \
            --market evidence/operational/CFB_MARKET_MONITOR_STATE.md \
            --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md \
            --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json \
            --profile WEEK9 --as-of 2026-10-30T23:58:00Z > "$RUNNER_TEMP/week9-readiness.json"
          python - "$RUNNER_TEMP/week9-readiness.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['games']==56
          assert sum(x['evaluation_coverage']['counts'].values())==56
          print('WEEK9_CANONICAL_56_GAME_COVERAGE',x['evaluation_coverage']['counts'])
          print('OPEN_REVIEW_QUEUE',len(x['evaluation_coverage']['uncertified_open_review_queue']))
          print('READINESS_AUDIT_ONLY_NO_NEW_WAGERS')
          PY
      - name: Upload Week9 canonical readiness audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week9-canonical-readiness-20261030
          path: ${{ runner.temp }}/week9-readiness.json
          retention-days: 14
          if-no-files-found: error
      - name: Boundary statement
        if: always()
        run: |
          echo "READ_ONLY_PRODUCTION_EXECUTION_SUBSTRATE_DIAGNOSTIC"
          echo "No new market quote, Champion decision, bet, canonical mutation, publication or RUN_PASS."
