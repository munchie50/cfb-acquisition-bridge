name: CFB Week9 Production Rescue - Git Runtime Evidence
on:
  push:
    branches: [rescue/week9-git-runtime-20261030]
    paths:
      - '.github/workflows/cfb_week9_rescue_git_runtime_probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  production-runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated rescue branch without modifying production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned main ancestor and accepted canonical objects
        shell: bash
        run: |
          set -euo pipefail
          PIN=ab98e454f19c059618491dfe1881b31890756c2b
          git cat-file -e "${PIN}^{commit}"
          git merge-base --is-ancestor "$PIN" HEAD
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git hash-object evidence/operational/CFB_MARKET_MONITOR_STATE.md)" = 69caf5b1184eedccc90be7562e4a3bd7cb8b7375
          test "$(git hash-object evidence/operational/CFB_DECISION_WAIT_LEDGER.md)" = bb5a9cc83b6a1425dc2972ca84b33aa2bbbf8fa9
          test "$(git hash-object evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md)" = 379eff0dfd4b7184633d0962e0a37b615384573e
          test "$(git hash-object evidence/operational/CFB_WEEK9_HOT_SHEET_2026-10-29_2008CT.md)" = f05173046e51ab9634d47b1be5fe90c2a5026c96
          echo "PINNED_FULL_HISTORY_AND_CANONICAL_BLOBS_PASS"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute governed independent Git runtime and immutable ancestry check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_runtime_checkout.py --destination "$RUNNER_TEMP/cfb-full-clone" --expected-head ab98e454f19c059618491dfe1881b31890756c2b > "$RUNNER_TEMP/runtime_result.json"
          python - "$RUNNER_TEMP/runtime_result.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='SUPPORTED_GIT_RUNTIME_VERIFIED'
          print('SUPPORTED_GIT_RUNTIME_VERIFIED',x['head'],'immutable_reviews',len(x['immutable_reviews']))
          PY
      - name: Execute existing production recovery consumer preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_recovery_consumer_preflight.py --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
      - name: Normalize live Friday public CBS source against 56 authentic Week9 identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:evidence/operational/CFB_FRIDAY_20261030_LATE_CBS_PUBLIC_BOARD_CAPTURE.md > "$RUNNER_TEMP/cfb-late-cbs.md"
          python scripts/cfb_cbs_full_board_normalizer.py \
            --markdown "$RUNNER_TEMP/cfb-late-cbs.md" \
            --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json \
            --recovered-by 2026-10-30T23:43:31.761Z \
            --profile WEEK9 --output "$RUNNER_TEMP/cfb-late-cbs-normalized.json"
          python - "$RUNNER_TEMP/cfb-late-cbs-normalized.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          c=d['coverage']
          assert c['governed_games']==56 and c['matched_games']==56 and not c['missing_game_ids']
          print('FRESH_PUBLIC_BOARD_IDENTITY_COVERAGE_PASS',c)
          print('RESEARCH_ONLY_NO_NEW_CHAMPION_DECISIONS')
          PY
      - name: Preserve normalized live public board as replayable research artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week9-20261030-2343z-public-board-normalized
          path: ${{ runner.temp }}/cfb-late-cbs-normalized.json
          retention-days: 14
          if-no-files-found: error
      - name: Normalize newly captured CBS Week9 rescue board against canonical identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_cbs_full_board_normalizer.py \
            --markdown evidence/operational/CFB_WEEK9_LIVE_CBS_CAPTURE_20261030_RESCUE.md \
            --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json \
            --recovered-by 2026-10-30T23:58:00Z \
            --profile WEEK9 --output "$RUNNER_TEMP/cfb-new-rescue-board.json"
          python - "$RUNNER_TEMP/cfb-new-rescue-board.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))['coverage']
          assert x['governed_games']==56 and x['matched_games']==56 and not x['missing_game_ids']
          print('NEW_RESCUE_BOARD_56_GAME_IDENTITY_PASS',x)
          PY
      - name: Verify authentic Week9 producer compiler and publication rejection controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_cfb_week9_*.py' -v
          echo "WEEK9_PRODUCER_CONTRACT_TESTS_COMPLETE_NO_PUBLICATION"
      - name: Execute authentic Week9 canonical readiness and full-coverage audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cfb_hot_sheet_readiness.py \
            --market evidence/operational/CFB_MARKET_MONITOR_STATE.md \
            --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md \
            --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json \
            --profile WEEK9 --as-of 2026-10-30T23:58:00Z > "$RUNNER_TEMP/week9-readiness.json"
          python - "$RUNNER_TEMP/week9-readiness.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['games']==56
          assert sum(x['evaluation_coverage']['counts'].values())==56
          print('WEEK9_CANONICAL_56_GAME_COVERAGE',x['evaluation_coverage']['counts'])
          print('OPEN_REVIEW_QUEUE',len(x['evaluation_coverage']['uncertified_open_review_queue']))
          print('READINESS_AUDIT_ONLY_NO_NEW_WAGERS')
          PY
      - name: Upload Week9 canonical readiness audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week9-canonical-readiness-20261030
          path: ${{ runner.temp }}/week9-readiness.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify persisted 33-case screening against original source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          saved=json.loads(Path('evidence/operational/CFB_WEEK9_33_CASE_MARKET_MOVEMENT_SCREENING_RESCUE.json').read_text())
          raw=Path(saved['source_path']).read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest==saved['source_blob_sha'], 'source blob changed'
          source=json.loads(raw)
          cases={c['game_id']:c for c in source['cases']}
          assert len(cases)==35 and len(saved['cases'])==33
          assert len({c['game_id'] for c in saved['cases']})==33
          assert set(cases)-{c['game_id'] for c in saved['cases']}=={'401862813','401856844'}
          for row in saved['cases']:
              original=cases[row['game_id']]
              assert row['material_drift_branches']==original['material_numeric_drift_branches']
              assert row['changed_branches']==[b['branch'] for b in original['branches'] if b['line_delta']!=0 or b['price_delta']!=0]
              assert row['disposition']=='REVIEW_REQUIRED_NO_NEW_DECISION'
          counts=saved['counts']
          assert counts['screened_cases']==33 and counts['material_drift_cases']==16 and counts['nonmaterial_drift_cases']==17
          assert counts['new_wagers_approved']==0
          print('WEEK9_33_CASE_SCREENING_INDEPENDENT_READBACK_PASS')
          PY
      - name: Build kickoff source-evidence reconciliation for 33 open screening cases
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/cfb-late-cbs-normalized.json" <<'PY'
          import json,sys
          from pathlib import Path
          board=json.loads(Path(sys.argv[1]).read_text())
          screen=json.loads(Path('evidence/operational/CFB_WEEK9_33_CASE_MARKET_MOVEMENT_SCREENING_RESCUE.json').read_text())
          byid={g['game_id']:g for g in board['games']}
          rows=[]
          for case in screen['cases']:
              g=byid[case['game_id']]
              rows.append({'game_id':case['game_id'],'game':case['game'],
                'source_display_kickoff_utc':g['source_kickoff_utc'],
                'source_temporal_status':g['temporal_status'],
                'canonical_kickoff_qualification':'NOT_ESTABLISHED_BY_PUBLIC_BOARD',
                'next_action':'INDEPENDENT_KICKOFF_QUALIFICATION_BEFORE_DECISION'})
          assert len(rows)==33 and len({x['game_id'] for x in rows})==33
          result={'schema':'CFB_WEEK9_KICKOFF_SOURCE_EVIDENCE_QUEUE_V1',
            'source_capture':'2026-10-30T23:43:31.761Z',
            'source_scope':'CBS_DISPLAY_ONLY_NOT_INDEPENDENT_KICKOFF_AUTHORITY',
            'rows':rows,'new_decisions':0,'canonical_mutations':0}
          out=Path('week9-kickoff-source-queue.json')
          out.write_text(json.dumps(result,indent=2)+'\n')
          assert json.loads(out.read_text())==result, 'serialized kickoff artifact is not valid JSON'
          print('KICKOFF_SOURCE_QUEUE',len(rows),'DISPLAY_TIMES',sum(x['source_display_kickoff_utc'] is not None for x in rows))
          PY
      - name: Preserve Week9 kickoff evidence reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week9-33-case-kickoff-source-queue
          path: week9-kickoff-source-queue.json
          retention-days: 14
          if-no-files-found: error
      - name: Execute authentic Week9 compiler replay with preserved decisions (historical dry-run only)
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/week9-producer-replay.json" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cfb_neutral_publication_gate as gate
          from cfb_week9_publication import compile
          market=Path('evidence/operational/CFB_MARKET_MONITOR_STATE.md').read_text()
          decision=Path('evidence/operational/CFB_DECISION_WAIT_LEDGER.md').read_text()
          lineage=Path('evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json').read_text()
          capture=Path('evidence/operational/CFB_WEEK9_LIVE_CBS_CAPTURE_20261030_RESCUE.md').read_text()
          at='2026-10-30T23:59:00Z'
          recovered='2026-10-30T23:58:00Z'
          result={'schema':'CFB_WEEK9_AUTHENTIC_COMPILER_HISTORICAL_DRY_RUN_V1',
            'mode':'READ_ONLY_HISTORICAL_REPLAY_NOT_CURRENT_PRODUCTION_DECISION',
            'recovered_by_utc':recovered,'as_of_utc':at,'new_champion_reviews':0,
            'venue_qualified':False,'new_wagers_approved':0,'canonical_mutations':0}
          try:
              selected=gate.selected_block(market,gate.profile_config('WEEK9')['market_tag'],
                  (gate.MARKET_SCHEMA,gate.WEEKLY_MARKET_SCHEMA),gate.clock(at))
              _,_,_,_,saved=gate.inputs(market,decision,lineage,selected['as_of_utc'],'WEEK9')
              rows=[{k:v for k,v in x.items() if k not in ('state_recorded_at_utc','state_evidence')} for x in saved.values()]
              assert len(rows)==56 and len({x['game_id'] for x in rows})==56
              pm,pd=compile(market,decision,capture,lineage,'CFB_MARKET_MONITOR_20261030T235800Z',at,recovered,rows)
              result.update(status='VALIDATED_PROPOSALS_HISTORICAL_REPLAY_ONLY',
                  market_blob=gate.blob(pm),decision_blob=gate.blob(pd),games=56,
                  note='Compiler executed on preserved decisions; not a new Champion six-branch review, current quote, or publication.')
          except Exception as exc:
              result.update(status='DRY_RUN_REJECTED',error_type=type(exc).__name__,error=str(exc))
          Path(sys.argv[1]).write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Preserve authentic compiler replay result
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week9-authentic-compiler-historical-replay
          path: ${{ runner.temp }}/week9-producer-replay.json
          retention-days: 14
          if-no-files-found: error
      - name: Boundary statement
        if: always()
        run: |
          echo "READ_ONLY_PRODUCTION_EXECUTION_SUBSTRATE_DIAGNOSTIC"
          echo "No new market quote, Champion decision, bet, canonical mutation, publication or RUN_PASS."
