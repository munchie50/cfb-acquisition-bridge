name: CFB Week13 retained raw artifact identity extraction QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb_week13_retained_raw_identity_extract_20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original collector HTML dependency
        run: python -m pip install lxml==5.4.0
      - name: Download previously captured raw Week13 artifact, no new source request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/week13-retained"
          gh api repos/${{ github.repository }}/actions/artifacts/14771817242/zip > "$RUNNER_TEMP/week13-retained.zip"
          python -m zipfile -e "$RUNNER_TEMP/week13-retained.zip" "$RUNNER_TEMP/week13-retained"
      - name: Parse retained HTML game tables and preserve raw identities
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import hashlib,json,re,os
          from pathlib import Path
          from lxml import html
          root=Path(os.environ['RUNNER_TEMP'])/'week13-retained'
          raw=(root/'cbs-week13-raw.html').read_bytes()
          assert len(raw)==3033720
          assert hashlib.sha256(raw).hexdigest()=='f2319f9354cc3fd5dac23edd328740fb62fb24e98fd75b20e1dfda38d0a6b695'
          tables=html.fromstring(raw).xpath('//table')
          ids=[]
          for table in tables:
            gid=table.get('data-game-id')
            abbrev=table.get('data-game-abbrev')
            teams=[]
            for row in table.xpath('.//tr')[1:3]:
              cells=row.xpath('./td|./th')
              if cells:
                links=[a for a in cells[0].xpath('.//a[@href]') if a.text_content().strip()]
                if links:teams.append(' '.join(links[-1].text_content().split()))
            ids.append({'cbs_id':gid,'cbs_abbrev':abbrev,'teams':teams})
          result={'schema':'CFB_WEEK13_RETAINED_RAW_IDENTITY_EXTRACTION_QA_V1',
                  'status':'PARSED_UNQUALIFIED_NOT_ACCEPTED',
                  'source_artifact_id':14771817242,'source_sha256':hashlib.sha256(raw).hexdigest(),
                  'tables':len(tables),'tables_with_cbs_id':sum(bool(x['cbs_id']) for x in ids),
                  'tables_with_two_teams':sum(len(x['teams'])==2 for x in ids),
                  'unique_cbs_ids':len(set(x['cbs_id'] for x in ids if x['cbs_id'])),
                  'games':ids,'original_lineage_accepted':False,
                  'canonical_publication_eligible':False,'wager_eligible':False}
          out=Path(os.environ['RUNNER_TEMP'])/'week13-identity'
          out.mkdir()
          (out/'identity.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='games'}))
          print('FIRST_10_GAMES',json.dumps(ids[:10]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-week13-retained-identity-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/week13-identity/
          retention-days: 14
          if-no-files-found: error
