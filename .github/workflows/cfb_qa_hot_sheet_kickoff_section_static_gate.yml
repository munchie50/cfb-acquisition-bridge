          python scripts/cfb_week6_production_frozen_gate.py --archive "$RUNNER_TEMP/cfb_first_frozen.zip" --selection-file "$RUNNER_TEMP/cfb_selected_sheets.jsonl"
          python scripts/cfb_week6_market_total_display_gate.py --selection-file "$RUNNER_TEMP/cfb_selected_sheets.jsonl"
