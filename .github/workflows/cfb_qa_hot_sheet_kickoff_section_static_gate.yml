      - 'evidence/CFB_ENGINE_WEEKLY_BETA_LEARNING_REVIEW_CONTRACT_v1_233.md'
      - 'evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json'
      - 'evidence/scheduler_qa/CFB_DUAL_ENGINE_HEALTH_20261011T215456Z_AUDIT.md'
      - 'scripts/cfb_money_ledger_guard.py'
      - 'scripts/test_cfb_money_ledger_guard.py'
      - 'evidence/operational/CFB_MONEY_LEDGER.md'
      - 'evidence/CFB_ENGINE_CONTROLLED_EXPERIMENTAL_CAPITAL_AND_PARLAY_EXPOSURE_v1_238.md'
      - 'scripts/cfb_accepted_refresh_field_adapter.py'
      - 'scripts/test_cfb_accepted_refresh_field_adapter.py'
      - 'evidence/operational/CFB_ACCEPTED_PREDICTION_SOURCE_STATE.json'
      - 'evidence/CFB_QA_WEEKLY_REFRESH_ACCEPTANCE_2026-10-07.md'
      - 'scripts/cfb_cbs_full_board_normalizer.py'
      - 'scripts/test_cfb_cbs_full_board_normalizer.py'
      - 'evidence/scheduler_qa/CFB_CBS_FULL_BOARD_TABLES_20261014T225920Z.md'
      - 'scripts/cfb_neutral_publication_gate.py'
      - 'scripts/cfb_hot_sheet_readiness.py'
      - 'scripts/cfb_conditional_recommendation_profile.py'
      - 'scripts/test_cfb_conditional_recommendation_profile.py'
      - 'scripts/cfb_saved_publication_audit.py'
      - 'scripts/test_cfb_saved_publication_audit.py'
      - 'scripts/cfb_consensus_reference.py'
      - 'scripts/test_cfb_consensus_reference.py'
      - 'scripts/test_cfb_hot_sheet_readiness.py'
      - 'evidence/CFB_CONSENSUS_BENCHMARK_AND_CAESARS_EXECUTION_CONTROL_2026-10-10.md'
      - 'scripts/cfb_neutral_weekly_reconciliation.py'
      - 'scripts/test_cfb_neutral_weekly_reconciliation.py'
      - 'scripts/cfb_neutral_publication_legacy_replay.py'
      - 'scripts/test_cfb_neutral_publication_gate.py'
      - 'scripts/test_cfb_neutral_publication_legacy_replay.py'
      - 'scripts/cfb_week7_monday_publication_gate.py'
      - 'scripts/test_cfb_week7_monday_publication_gate.py'
      - 'scripts/cfb_week7_frozen_field_invariant.py'
      - 'scripts/test_cfb_week7_frozen_field_invariant.py'
      - 'scripts/cfb_week7_first_frozen_projection_gate.py'
      - 'scripts/test_cfb_week7_first_frozen_projection_gate.py'
      - 'scripts/cfb_week7_accepted_s0_ancestry_audit.py'
      - 'scripts/test_cfb_week7_accepted_s0_ancestry_audit.py'
      - 'scripts/cfb_week7_afternoon_display_gate.py'
      - 'scripts/test_cfb_week7_afternoon_display_gate.py'
      - 'scripts/cfb_week7_opening_display_gate.py'
      - 'scripts/test_cfb_week7_opening_display_gate.py'
      - 'scripts/test_cfb_hot_sheet_execution_aware_decision_gate.py'
      - 'evidence/operational/CFB_EXECUTION_LEDGER.md'
      - 'scripts/test_cfb_hot_sheet_current_decision_binding_gate.py'
      - 'evidence/operational/CFB_DECISION_WAIT_LEDGER.md'
      - 'evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v*.md'
      - 'scripts/cfb_hot_sheet_decision_projection_gate.py'
      - 'scripts/test_cfb_hot_sheet_decision_projection_gate.py'
      - 'scripts/cfb_full_review_scope_gate.py'
      - 'scripts/test_cfb_full_review_scope_gate.py'
      - 'evidence/operational/CFB_WEEK6_FULL_SATURDAY_DINNER_REVIEW_2026-10-09.md'
      - 'scripts/cfb_recovery_navigation_reader.py'
      - 'scripts/test_cfb_recovery_navigation_reader.py'
      - 'scripts/test_cfb_week6_production_frozen_gate.py'
      - 'evidence/operational/CFB_WEEK6_HOT_SHEET_*.md'
      - 'evidence/operational/CFB_WEEK7_HOT_SHEET_*.md'
      - 'evidence/operational/CFB_MARKET_MONITOR_STATE.md'
      - '.github/workflows/cfb_qa_hot_sheet_kickoff_section_static_gate.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/cfb_hot_sheet_readiness.py'
      - 'scripts/test_cfb_hot_sheet_readiness.py'
      - 'evidence/CFB_ENGINE_WEEKLY_BETA_LEARNING_REVIEW_CONTRACT_v1_233.md'
      - 'evidence/CFB_ENGINE_REVIEW_FINDINGS_AND_DURABLE_ACTION_REGISTER_2026-09-28.md'
      - 'evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v*.md'
      - '.github/workflows/cfb_qa_hot_sheet_kickoff_section_static_gate.yml'
  workflow_dispatch:
jobs:
  static-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Completeness diagnostics cannot promote bets or verify venue offers.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise complete CBS table capture and incomplete-response rejection
        run: python -m unittest discover -s scripts -p test_cfb_cbs_full_board_normalizer.py
      - name: Exercise recommendation versus venue readiness separation
        run: python -m unittest discover -s scripts -p test_cfb_hot_sheet_readiness.py
      - name: Exercise descriptive consensus source and price boundaries
        run: python -m unittest discover -s scripts -p test_cfb_consensus_reference.py
      - name: Exercise saved-view clock separation without weakening live gate
        run: python -m unittest discover -s scripts -p test_cfb_saved_publication_audit.py
      - name: Exercise conditional review evidence and unchanged neutral boundaries
        run: python -m unittest discover -s scripts -p test_cfb_conditional_recommendation_profile.py
      - name: Normalize retained real full-board capture without operational mutation
        run: python scripts/cfb_cbs_full_board_normalizer.py --markdown evidence/scheduler_qa/CFB_CBS_FULL_BOARD_TABLES_20261014T225920Z.md --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json --recovered-by 2026-10-14T22:59:20Z
      - name: Exercise confirmed funding deduplication and transaction-type boundaries
        run: python -m unittest discover -s scripts -p test_cfb_money_ledger_guard.py
      - name: Exercise complete recovery consumer dependency boundaries
        run: |
          python -m unittest discover -s scripts -p test_cfb_recovery_consumer_preflight.py
          python -m unittest discover -s scripts -p test_cfb_planned_append_metadata.py
      - name: Validate complete current recovery consumer bindings
        run: python scripts/cfb_recovery_consumer_preflight.py --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
      - name: Validate selected money record and its historical execution snapshot
        run: |
          PYTHONPATH=scripts python -c 'import sys; from test_cfb_week7_opening_display_gate import snapshot; sys.stdout.write(snapshot("evidence/operational/CFB_EXECUTION_LEDGER.md","75caee4052e02ea7d2453d1d37fd3866e13ecc07"))' > "$RUNNER_TEMP/cfb_funding_execution_snapshot.md"
          python scripts/cfb_money_ledger_guard.py --money evidence/operational/CFB_MONEY_LEDGER.md --execution "$RUNNER_TEMP/cfb_funding_execution_snapshot.md" --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
      - name: Exercise weekly carry-forward ancestry and historical-preservation boundaries
        run: python -m unittest discover -s scripts -p test_cfb_weekly_carry_forward_gate.py
      - name: Validate selected weekly learning correction and exact source bindings
        run: |
          python scripts/cfb_weekly_carry_forward_gate.py --review evidence/CFB_ENGINE_WEEKLY_BETA_LEARNING_REVIEW_2026-10-11_R2.md --original evidence/CFB_ENGINE_WEEKLY_BETA_LEARNING_REVIEW_2026-10-11_R1.md --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json --health evidence/scheduler_qa/CFB_DUAL_ENGINE_HEALTH_20261011T215456Z_AUDIT.md --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md
      - name: Validate original research candidate
        run: python scripts/cfb_hot_sheet_kickoff_section_static_gate.py
      - name: Exercise production presentation rejection boundaries
        run: python -m unittest discover -s scripts -p test_cfb_hot_sheet_production_section_gate.py
      - name: Exercise append-only decision naming coverage boundaries
        run: python -m unittest discover -s scripts -p test_cfb_week6_decision_coverage_audit.py
      - name: Exercise declared canonical market-total display boundaries
        run: python -m unittest discover -s scripts -p test_cfb_week6_market_total_display_gate.py
      - name: Exercise qualified Saturday market-total boundaries
        run: python -m unittest discover -s scripts -p test_cfb_week6_saturday_total_display_gate.py
      - name: Exercise qualified afternoon fresh and retained total boundaries
        run: python -m unittest discover -s scripts -p test_cfb_week6_afternoon_total_display_gate.py
      - name: Exercise explicit recovery navigation boundaries
        run: python -m unittest discover -s scripts -p test_cfb_recovery_navigation_reader.py
      - name: Exercise full-review scope and explicit trip-clock boundaries
        run: python -m unittest discover -s scripts -p test_cfb_full_review_scope_gate.py
      - name: Validate retained full Saturday dinner review coverage
        run: python scripts/cfb_full_review_scope_gate.py --baseline evidence/operational/CFB_WEEK6_HOT_SHEET_2026-10-09_1538CT.md --review evidence/operational/CFB_WEEK6_FULL_SATURDAY_DINNER_REVIEW_2026-10-09.md
      - name: Exercise current decision and conditional cutoff display boundaries
        run: python -m unittest discover -s scripts -p test_cfb_hot_sheet_decision_projection_gate.py
      - name: Exercise explicit current-publication source binding boundaries
        run: python -m unittest discover -s scripts -p test_cfb_hot_sheet_current_decision_binding_gate.py
      - name: Validate explicitly selected current Hot Sheet against canonical decision state
        run: |
          python scripts/cfb_hot_sheet_current_decision_binding_gate.py --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md --current-ledger evidence/operational/CFB_DECISION_WAIT_LEDGER.md > "$RUNNER_TEMP/cfb_current_sheet_binding.json"
          cat "$RUNNER_TEMP/cfb_current_sheet_binding.json"
      - name: Recover authenticated accepted FIRST_FROZEN archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10897612260/zip > "$RUNNER_TEMP/cfb_first_frozen.zip"
          echo "772b8683365ebf62d35fc3813beb138688b84af4172a0b261fd9218691d5adcf  $RUNNER_TEMP/cfb_first_frozen.zip" | sha256sum -c -
      - name: Recover separate accepted October6 REFRESH ancestry archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/11423386216/zip > "$RUNNER_TEMP/cfb_accepted_refresh.zip"
          echo "674501a82f6eb207b58b30c483910304c881b3ce29ba2506258152455cb6047b  $RUNNER_TEMP/cfb_accepted_refresh.zip" | sha256sum -c -
      - name: Exercise original Week7 lineage and no-substitution boundaries
        env:
          CFB_ACCEPTED_FREEZE_ARCHIVE: ${{ runner.temp }}/cfb_first_frozen.zip
          CFB_ACCEPTED_REFRESH_ARCHIVE: ${{ runner.temp }}/cfb_accepted_refresh.zip
        run: |
          python -m unittest discover -s scripts -p test_cfb_week8_publication.py
          python -m unittest discover -s scripts -p test_cfb_week8_closed_conditional.py
          python -m unittest discover -s scripts -p test_cfb_week9_publication.py
          python -m unittest discover -s scripts -p test_cfb_week7_accepted_s0_ancestry_audit.py
          python -m unittest discover -s scripts -p test_cfb_week7_first_frozen_projection_gate.py
          python -m unittest discover -s scripts -p test_cfb_week7_frozen_field_invariant.py
          python -m unittest discover -s scripts -p test_cfb_accepted_refresh_field_adapter.py
          python -m unittest discover -s scripts -p test_cfb_week7_opening_display_gate.py
          python -m unittest discover -s scripts -p test_cfb_week7_afternoon_display_gate.py
      - name: Validate separate historical accepted October6 refresh field interface
        run: |
          PYTHONPATH=scripts python -c 'import sys; from test_cfb_week7_opening_display_gate import snapshot; sys.stdout.write(snapshot("evidence/operational/CFB_ACCEPTED_PREDICTION_SOURCE_STATE.json","6254ab28b90d9fa4a815124ea7ffec2850ddfc30"))' > "$RUNNER_TEMP/cfb_accepted_oct6_pointer.json"
          PYTHONPATH=scripts python -c 'import sys; from test_cfb_week7_opening_display_gate import snapshot; sys.stdout.write(snapshot("evidence/CFB_QA_WEEKLY_REFRESH_ACCEPTANCE_2026-10-07.md","a4fb4c56addf12335a477034673e167afc28ebb4"))' > "$RUNNER_TEMP/cfb_oct6_acceptance.md"
          python scripts/cfb_accepted_refresh_field_adapter.py --refresh "$RUNNER_TEMP/cfb_accepted_refresh.zip" --pointer "$RUNNER_TEMP/cfb_accepted_oct6_pointer.json" --acceptance "$RUNNER_TEMP/cfb_oct6_acceptance.md" --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json
      - name: Exercise execution-aware current decision rejection boundaries
        run: python -m unittest discover -s scripts -p test_cfb_hot_sheet_execution_aware_decision_gate.py
      - name: Exercise typed neutral publication chronology and decision boundaries
        run: python -m unittest discover -s scripts -p 'test_cfb_neutral_publication*.py'
      - name: Exercise full-week source reconciliation and historical PASS boundaries
        run: python -m unittest discover -s scripts -p test_cfb_neutral_weekly_reconciliation.py
      - name: Replay authentic Monday legacy inputs through the neutral schema without operational writes
        run: python scripts/cfb_neutral_publication_legacy_replay.py --historical --market evidence/operational/CFB_MARKET_MONITOR_STATE.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --execution evidence/operational/CFB_EXECUTION_LEDGER.md --scorecard evidence/operational/CFB_POSTGAME_FIRST_FROZEN_SCORECARD.md --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json
      - name: Exercise bounded Monday source-profile and publication rejection boundaries
        run: python -m unittest discover -s scripts -p test_cfb_week7_monday_publication_gate.py
      - name: Validate current execution-aware decision and ticket projection
        run: |
          cfb_current_sheet=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sheet_path"])' "$RUNNER_TEMP/cfb_current_sheet_binding.json")
          if [[ "$cfb_current_sheet" == evidence/operational/CFB_WEEK7_HOT_SHEET_* ]]; then
            python scripts/cfb_week7_frozen_field_invariant.py --sheet "$cfb_current_sheet" --first "$RUNNER_TEMP/cfb_first_frozen.zip" --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json
          fi
          case "$cfb_current_sheet" in
            evidence/operational/CFB_WEEK6_HOT_SHEET_*)
              python scripts/cfb_hot_sheet_execution_aware_decision_gate.py --index evidence/CFB_ENGINE_CURRENT_RECOVERY_INDEX_v1_245.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --execution evidence/operational/CFB_EXECUTION_LEDGER.md --baseline evidence/operational/CFB_WEEK6_HOT_SHEET_2026-10-09_1538CT.md ;;
            evidence/operational/CFB_WEEK7_HOT_SHEET_2026-10-11_0708CT.md)
              python -m unittest discover -s scripts -p test_cfb_week7_opening_display_gate.py
              python scripts/cfb_week7_opening_display_gate.py --sheet "$cfb_current_sheet" --market evidence/operational/CFB_MARKET_MONITOR_STATE.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md ;;
            evidence/operational/CFB_WEEK7_HOT_SHEET_2026-10-11_1305CT.md)
              python -m unittest discover -s scripts -p test_cfb_week7_opening_display_gate.py
              python -m unittest discover -s scripts -p test_cfb_week7_afternoon_display_gate.py
              PYTHONPATH=scripts python -c 'import sys; from test_cfb_week7_opening_display_gate import snapshot; sys.stdout.write(snapshot("evidence/operational/CFB_MARKET_MONITOR_STATE.md","444d42107c646c379b2b51ac643460f3123ea9e6"))' > "$RUNNER_TEMP/cfb_week7_morning_market.md"
              PYTHONPATH=scripts python -c 'import sys; from test_cfb_week7_opening_display_gate import snapshot; sys.stdout.write(snapshot("evidence/operational/CFB_DECISION_WAIT_LEDGER.md","4c6b3468f0e0839ce85be0c96a5e9498b94d692a"))' > "$RUNNER_TEMP/cfb_week7_morning_decision.md"
              python scripts/cfb_week7_afternoon_display_gate.py --sheet "$cfb_current_sheet" --market evidence/operational/CFB_MARKET_MONITOR_STATE.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --morning-market "$RUNNER_TEMP/cfb_week7_morning_market.md" --morning-decision "$RUNNER_TEMP/cfb_week7_morning_decision.md" --execution evidence/operational/CFB_EXECUTION_LEDGER.md --scorecard evidence/operational/CFB_POSTGAME_FIRST_FROZEN_SCORECARD.md ;;
            evidence/operational/CFB_WEEK7_HOT_SHEET_2026-10-11_1429CT.md)
              PYTHONPATH=scripts python -c 'import sys; from test_cfb_week7_opening_display_gate import snapshot; sys.stdout.write(snapshot("evidence/operational/CFB_DECISION_WAIT_LEDGER.md","4a525667b6ecfbeaf6e74222d18640e91e5d35f2"))' > "$RUNNER_TEMP/cfb_week7_prior_decision.md"
              python scripts/cfb_week7_first_frozen_projection_gate.py --sheet "$cfb_current_sheet" --parent evidence/operational/CFB_WEEK7_HOT_SHEET_2026-10-11_1305CT.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --prior-decision "$RUNNER_TEMP/cfb_week7_prior_decision.md" --first "$RUNNER_TEMP/cfb_first_frozen.zip" --refresh "$RUNNER_TEMP/cfb_accepted_refresh.zip" ;;
            evidence/operational/CFB_WEEK7_HOT_SHEET_*)
              if python -c 'import sys; from pathlib import Path; sys.exit(0 if any(x in Path(sys.argv[1]).read_text().splitlines() for x in ("**Presentation schema:** CFB_NEUTRAL_PUBLICATION_V1", "**Presentation schema:** CFB_NEUTRAL_WEEKLY_PUBLICATION_V2", "**Presentation schema:** CFB_WEEKLY_CONDITIONAL_PUBLICATION_V3")) else 1)' "$cfb_current_sheet"; then
                python scripts/cfb_saved_publication_audit.py --recover-saved-inputs --sheet "$cfb_current_sheet" --market evidence/operational/CFB_MARKET_MONITOR_STATE.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --execution evidence/operational/CFB_EXECUTION_LEDGER.md --scorecard evidence/operational/CFB_POSTGAME_FIRST_FROZEN_SCORECARD.md --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              else
              python scripts/cfb_week7_monday_publication_gate.py --sheet "$cfb_current_sheet" --market evidence/operational/CFB_MARKET_MONITOR_STATE.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --execution evidence/operational/CFB_EXECUTION_LEDGER.md --scorecard evidence/operational/CFB_POSTGAME_FIRST_FROZEN_SCORECARD.md --morning evidence/operational/CFB_WEEK7_HOT_SHEET_2026-10-12_0707CT.md --lineage evidence/operational/CFB_WEEK7_ORIGINAL_FIRST_FROZEN_LINEAGE_2026-10-11.json
              fi ;;
            evidence/operational/CFB_WEEK8_HOT_SHEET_*)
              python scripts/cfb_week8_frozen_field_invariant.py --sheet "$cfb_current_sheet" --first "$RUNNER_TEMP/cfb_first_frozen.zip" --lineage evidence/scheduler_qa/CFB_WEEK8_ORIGINAL_ANCESTRY_RECOVERY_20261020.json
              python scripts/cfb_saved_publication_audit.py --profile WEEK8 --recover-saved-inputs --sheet "$cfb_current_sheet" --market evidence/operational/CFB_MARKET_MONITOR_STATE.md --decision evidence/operational/CFB_DECISION_WAIT_LEDGER.md --execution evidence/operational/CFB_EXECUTION_LEDGER.md --scorecard evidence/operational/CFB_POSTGAME_FIRST_FROZEN_SCORECARD.md --lineage evidence/scheduler_qa/CFB_WEEK8_ORIGINAL_ANCESTRY_RECOVERY_20261020.json --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" ;;
            evidence/operational/CFB_WEEK9_HOT_SHEET_*)
              python scripts/cfb_week9_frozen_field_invariant.py --sheet "$cfb_current_sheet" --first "$RUNNER_TEMP/cfb_first_frozen.zip" --lineage evidence/scheduler_qa/CFB_WEEK9_ORIGINAL_ANCESTRY_RECOVERY_20261025.json
