      - name: Validate retained and newly changed Week 6 production sheets
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          cfb_current_sheet=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sheet_path"])' "$RUNNER_TEMP/cfb_current_sheet_binding.json")
          args=(--sheet evidence/operational/CFB_WEEK6_HOT_SHEET_2026-10-09_1538CT.md)
          if [[ "$cfb_current_sheet" == evidence/operational/CFB_WEEK6_HOT_SHEET_* ]]; then
            args+=(--sheet "$cfb_current_sheet")
