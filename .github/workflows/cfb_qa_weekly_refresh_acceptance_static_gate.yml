name: CFB QA Weekly Refresh Acceptance Static Gate

on:
  push:
    paths:
      - 'scripts/cfb_qa_weekly_refresh_acceptance.py'
      - 'scripts/cfb_qa_weekly_refresh_acceptance_static_gate.py'
      - '.github/workflows/cfb_qa_weekly_refresh_acceptance_static_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/cfb_qa_weekly_refresh_acceptance_static_gate.py
