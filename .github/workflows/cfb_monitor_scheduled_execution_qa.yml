name: CFB Monitor scheduled execution QA
on:
  schedule:
    - cron: '17,37,57 22,23 10 11 *'
    - cron: '17,37,57 0-5 11 11 *'
permissions:
  contents: read
jobs:
  scheduled-qa:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIXTURE_HEAD: 37d692d65b05632a376d31cdefbd3ec23ef5103e
    steps:
      - name: Record clock and enforce the bounded test window
        id: window
        run: |
          set -euo pipefail
          now="$(date -u +%FT%TZ)"
          if [[ "$now" < 2026-11-10T22:17:00Z || "$now" > 2026-11-11T06:00:00Z ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/scheduled-proof"
          printf '%s\n' "$now event=$GITHUB_EVENT_NAME run=$GITHUB_RUN_ID workflow_head=$GITHUB_SHA" | tee "$RUNNER_TEMP/scheduled-proof/start.txt"
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          ref: ${{ env.FIXTURE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned runtime and immutable reviews
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIXTURE_HEAD"
          python3 scripts/cfb_runtime_checkout.py --destination "$RUNNER_TEMP/verified-repo" --expected-head "$FIXTURE_HEAD" > "$RUNNER_TEMP/scheduled-proof/runtime.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["status"],d["head"],len(d["immutable_reviews"]))' "$RUNNER_TEMP/scheduled-proof/runtime.json"
      - name: Execute Week 11 compiler and renderer
        if: steps.window.outputs.active == 'true'
        working-directory: ${{ runner.temp }}/verified-repo
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.test_cfb_week11_publication 2>&1 | tee "$RUNNER_TEMP/scheduled-proof/week11-tests.txt"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          result = {'status': 'PASS_SCHEDULED_EXECUTION',
                    'event': os.environ['GITHUB_EVENT_NAME'],
                    'run_id': os.environ['GITHUB_RUN_ID'],
                    'pinned_head': os.environ['FIXTURE_HEAD'],
                    'completed_at': datetime.now(timezone.utc).isoformat(),
                    'scope': 'pinned checkout and controlled Week 11 compiler/render tests'}
          (Path(os.environ['RUNNER_TEMP']) / 'scheduled-proof/result.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.window.outputs.active == 'true' }}
        with:
          name: scheduled-execution-proof
          path: ${{ runner.temp }}/scheduled-proof/
          retention-days: 7
          if-no-files-found: error
