name: CFB 2022 Giveaway Replay v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/giveaway_replay_v3.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-stringr
      - name: Acquire frozen source and pinned helpers
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o x.rds https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_2022.rds
          echo 'dcf59fe1f694c5eaef0ce89d1ce14dbcbe571c60fa7d94f40399e50c9a38ea8a  x.rds' | sha256sum -c -
          base=https://raw.githubusercontent.com/sportsdataverse/cfbfastR/006729304e8b7b6ec392dff93cfd0b649e741675/R
          curl -L --fail -o helper_air.R "$base/helper_pbp_air_yards.R"
      - name: Replay exact pinned giveaway semantics
        shell: Rscript {0}
        run: |
          library(stringr); source("helper_air.R"); x<-readRDS("x.rds"); dir.create("evidence")
          txt<-ifelse(is.na(x$play_text),"",as.character(x$play_text))
          clean<-str_remove(txt,"(?is)\\(Original Play:.*?\\)\\s*$")
          recs<-str_match_all(clean,regex("recovered by\\s+([A-Z&]{2,})\\b",ignore_case=TRUE))
          rec1<-vapply(recs,function(m)if(nrow(m)>=1)toupper(m[1,2])else NA_character_,character(1))
          rec2<-vapply(recs,function(m)if(nrow(m)>=2)toupper(m[2,2])else NA_character_,character(1))
          gid<-as.character(x$game_id); pos<-as.character(x$pos_team); def<-as.character(x$def_pos_team)
          rt1<-rt2<-rep(NA_character_,nrow(x))
          for(ix in split(seq_len(nrow(x)),gid)){
            side<-.spot_side_map(txt[ix],x$yards_to_goal_end[ix],pos[ix],def[ix])
            if(length(side)){rt1[ix]<-unname(side[.spot_key(rec1[ix])]);rt2[ix]<-unname(side[.spot_key(rec2[ix])])}
          }
          one<-function(v)!is.na(v)&suppressWarnings(as.numeric(v))>0
          is_int<-one(x$int)|one(x$interception_stat)|one(x$interception_thrown_stat)
          # pinned helper: fumble occurrence is source fumble flag OR fumble/muff text, but reversed original text is stripped first
          fumble<-one(x$fumble_vec)|one(x$fumble_stat)|str_detect(clean,regex("fumble|muff",ignore_case=TRUE))
          fumbling<-ifelse(!fumble,NA_character_,ifelse(is_int,def,pos))
          same<-function(a,b)!is.na(a)&!is.na(b)&a==b; diff<-function(a,b)!is.na(a)&!is.na(b)&a!=b
          loser1<-ifelse(fumble & !is.na(rt1)&!is.na(fumbling)&diff(rt1,fumbling),fumbling,NA_character_)
          loser2<-ifelse(fumble & !is.na(rt2)&!is.na(rt1)&diff(rt2,rt1),rt1,NA_character_)
          pfl<-same(loser1,pos)|same(loser2,pos); dfl<-same(loser1,def)|same(loser2,def)
          # one event identity per side/type/play; no duplicate-source-row multiplication
          ev<-rbind(
            data.frame(game_id=gid[is_int],team=pos[is_int],event="INTERCEPTION",id_play=as.character(x$id_play[is_int])),
            data.frame(game_id=gid[pfl],team=pos[pfl],event="FUMBLE_LOST",id_play=as.character(x$id_play[pfl])),
            data.frame(game_id=gid[dfl],team=def[dfl],event="FUMBLE_LOST",id_play=as.character(x$id_play[dfl]))
          )
          k<-paste(ev$game_id,ev$team,ev$event,ev$id_play,sep="|")
          evu<-ev[!duplicated(k),]
          write.csv(ev,"evidence/events_before_identity_dedupe.csv",row.names=FALSE)
          write.csv(evu,"evidence/events_unique.csv",row.names=FALSE)
          # all game-team sides retained
          keys<-unique(rbind(data.frame(game_id=gid,team=pos),data.frame(game_id=gid,team=def)))
          keys<-keys[!is.na(keys$team)&keys$team!="",]
          cnt<-function(e,nm){q<-evu[evu$event==e,]; if(!nrow(q))return(data.frame(game_id=character(),team=character(),x=integer())); z<-aggregate(rep(1,nrow(q)),list(game_id=q$game_id,team=q$team),sum);names(z)[3]<-nm;z}
          a<-merge(keys,cnt("INTERCEPTION","interceptions"),all.x=TRUE,by=c("game_id","team"))
          a<-merge(a,cnt("FUMBLE_LOST","fumbles_lost"),all.x=TRUE,by=c("game_id","team"))
          a$interceptions[is.na(a$interceptions)]<-0;a$fumbles_lost[is.na(a$fumbles_lost)]<-0;a$giveaways<-a$interceptions+a$fumbles_lost
          write.csv(a,"evidence/team_game_giveaways_v3.csv",row.names=FALSE)
          unresolved<-fumble & vapply(recs,nrow,integer(1))>0 & is.na(rt1)
          write.csv(data.frame(game_id=gid[unresolved],id_play=x$id_play[unresolved],pos_team=pos[unresolved],def_pos_team=def[unresolved],play_type=x$play_type[unresolved],play_text=txt[unresolved],clean_text=clean[unresolved],token=rec1[unresolved]),"evidence/unresolved_v3.csv",row.names=FALSE)
          s<-data.frame(rows=nrow(x),games=length(unique(gid)),team_games=nrow(a),interceptions=sum(a$interceptions),fumbles_lost=sum(a$fumbles_lost),giveaways=sum(a$giveaways),events_before=nrow(ev),events_unique=nrow(evu),duplicate_event_rows_removed=nrow(ev)-nrow(evu),unresolved=sum(unresolved),double_side_fumble_plays=sum(pfl&dfl),original_play_text_rows=sum(grepl("\\(Original Play:",txt,fixed=FALSE)))
          write.csv(s,"evidence/summary_v3.csv",row.names=FALSE);print(s)
      - name: Hash
        run: cd evidence && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: cfb-2022-giveaway-replay-v3, path: evidence/, retention-days: 3}
