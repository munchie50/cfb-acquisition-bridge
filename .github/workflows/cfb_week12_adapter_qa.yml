name: CFB Week12 adapter isolated QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb_week12_adapter_qa.yml'
      - 'scripts/cfb_week12_verified_capture_adapter.py'
      - 'qa/test_cfb_week12_verified_capture_adapter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated Week12 adapter contract tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s qa -p 'test_cfb_week12_verified_capture_adapter.py' -v
