name: CFB Monitor offline bundle QA
on:
  push:
    branches: [qa/monitor-offline-bundle-20261111]
    paths: [.github/workflows/cfb_monitor_offline_bundle_qa.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ENGINE_PIN: d792d0a95d4af36e6df7b5c352a74cd9deeea92b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create and verify full-history engine bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor "$ENGINE_PIN" refs/remotes/origin/main
          git branch offline-engine "$ENGINE_PIN"
          git bundle create "$RUNNER_TEMP/engine.bundle" refs/heads/offline-engine
          git bundle verify "$RUNNER_TEMP/engine.bundle"
          GIT_ALLOW_PROTOCOL=file git clone --branch offline-engine "$RUNNER_TEMP/engine.bundle" "$RUNNER_TEMP/offline"
          test "$(git -C "$RUNNER_TEMP/offline" rev-parse HEAD)" = "$ENGINE_PIN"
          test "$(git -C "$RUNNER_TEMP/offline" rev-parse --is-shallow-repository)" = false
      - name: Diagnose artifact, pin, checkout, and current profile independently
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/probe.zip"
          python3 -m zipfile -c "$archive" "$RUNNER_TEMP/engine.bundle"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          args=(--archive "$archive" --profile-script cfb_week12_publication.py)
          python3 qa/cfb_monitor_offline_bundle_probe.py "${args[@]}" --archive-digest "$digest" --expected-head "$ENGINE_PIN" --destination "$RUNNER_TEMP/diag-valid" | tee "$RUNNER_TEMP/valid.json"
          if python3 qa/cfb_monitor_offline_bundle_probe.py "${args[@]}" --archive-digest "$digest" --expected-head dd4b33db02d28df7dcd3328a8fc63036bfc06064 --destination "$RUNNER_TEMP/diag-stale" > "$RUNNER_TEMP/stale.json"; then exit 1; fi
          if python3 qa/cfb_monitor_offline_bundle_probe.py "${args[@]}" --archive-digest wrong --expected-head "$ENGINE_PIN" --destination "$RUNNER_TEMP/diag-corrupt" > "$RUNNER_TEMP/corrupt.json"; then exit 1; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"])
          valid, stale, corrupt = [json.loads((d / f"{name}.json").read_text()) for name in ("valid", "stale", "corrupt")]
          assert valid["status"] == "FILE_ONLY_CHECKOUT_VERIFIED" and valid["immutable_reviews"] > 0
          assert stale["stage"] == "PIN_VALIDATION" and corrupt["stage"] == "ARCHIVE_INTEGRITY"
          print(json.dumps({"valid": valid, "stale": stale, "digest_mismatch": corrupt}))
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: cfb-monitor-offline-bundle
          path: ${{ runner.temp }}/engine.bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
