name: CFB Phase4 Derived Feature Acceptance Diagnostics v1.118
on:
  push:
    paths:
      - '.github/workflows/phase4_derived_feature_acceptance_v1_118.yml'
      - 'scripts/phase4_derived_feature_acceptance_v1_118.R'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Acquire TRAIN VALIDATION PBP only
        shell: bash
        run: |
          mkdir -p pbp
          Rscript - <<'RS'
          for (yr in 2016:2024) {
            u <- sprintf("https://github.com/sportsdataverse/cfbfastR-data/raw/master/data/rds/pbp/play_by_play_%d.rds", yr)
            download.file(u, sprintf("pbp/pbp_%d.rds",yr), mode="wb", quiet=TRUE)
          }
          RS
      - name: Run independent acceptance diagnostics
        run: Rscript scripts/phase4_derived_feature_acceptance_v1_118.R pbp evidence/phase4_qualified_schedule_2016_2024.csv
      - name: Assert TEST excluded
        run: '! grep -q "^2025," phase4_derived_acceptance_samples_v1_118.csv'
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-phase4-derived-feature-acceptance-v1-118
          path: |
            phase4_derived_acceptance_samples_v1_118.csv
            phase4_field_position_order_audit_v1_118.csv
            phase4_overtime_semantics_audit_v1_118.csv
