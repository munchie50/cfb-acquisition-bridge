name: CFB Phase4 Derived Feature Canary v1.115
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase4_derived_feature_canary_v1_115.R'
      - 'evidence/phase4_qualified_schedule_2016_2024.csv'
      - '.github/workflows/phase4_derived_feature_canary_v1_115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install R
        run: sudo apt-get update && sudo apt-get install -y r-base
      - name: Acquire TRAIN VALIDATION PBP only
        run: |
          mkdir -p raw
          for YEAR in {2016..2024}; do curl --fail --location --retry 3 --output "raw/pbp_${YEAR}.rds" "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfbfastR_cfb_pbp/play_by_play_${YEAR}.rds"; done
      - name: Run frozen derived feature canary
        run: Rscript scripts/phase4_derived_feature_canary_v1_115.R raw evidence/phase4_qualified_schedule_2016_2024.csv
      - name: Assert TEST excluded
        run: '! grep -q "^2025," phase4_derived_feature_canary_v1_115.csv'
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-phase4-derived-feature-canary-v1-115
          path: |
            phase4_derived_team_game_primitives_v1_115.csv
            phase4_derived_feature_canary_v1_115.csv
