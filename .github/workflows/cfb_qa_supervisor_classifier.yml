name: CFB QA Supervisor Read-only Classifier
on:
  push:
    branches: [qa/monitor-no-update-investigation-20261030]
    paths:
      - 'scripts/cfb_supervisor_readonly_qa.py'
      - 'scripts/test_cfb_supervisor_readonly_qa.py'
      - '.github/workflows/cfb_qa_supervisor_classifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify source, compile and run nine no-network fixture tests
        run: |
          git hash-object scripts/cfb_supervisor_readonly_qa.py scripts/test_cfb_supervisor_readonly_qa.py
          python3 -m py_compile scripts/cfb_supervisor_readonly_qa.py scripts/test_cfb_supervisor_readonly_qa.py
          python3 -m unittest discover -s scripts -p 'test_cfb_supervisor_readonly_qa.py' -v
